<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>配置 - 渔榜助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: #f5f7fa; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
        .app-container { max-width: 800px; width: 100%; padding: 12px 12px 100px; }

        /* ============================================================ */
        /* 仪表盘顶栏 */
        /* ============================================================ */
        .dashboard-header {
            background: linear-gradient(135deg, #0a2f44, #1a5f7a);
            border-radius: 16px;
            padding: 18px 18px 20px;
            margin-bottom: 14px;
            box-shadow: 0 6px 20px rgba(10,47,68,0.25);
            position: relative;
            overflow: hidden;
        }
        .dashboard-header::before {
            content: '';
            position: absolute;
            top: -30px; right: -30px;
            width: 120px; height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
        }
        .dashboard-header::after {
            content: '';
            position: absolute;
            bottom: -40px; left: -20px;
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
        }
        .dashboard-header .greeting {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
        }
        .dashboard-header .sub-greeting {
            color: rgba(255,255,255,0.65);
            font-size: 12px;
            position: relative;
            z-index: 1;
        }

        /* ============================================================ */
        /* 统计卡片 */
        /* ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }
        .stat-card {
            background: #fff;
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform .15s;
        }
        .stat-card:active { transform: scale(0.97); }
        .stat-card .stat-icon {
            font-size: 22px;
            margin-bottom: 4px;
        }
        .stat-card .stat-num {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.5px;
        }
        .stat-card .stat-label {
            font-size: 11px;
            color: #6b8ba0;
            margin-top: 4px;
        }
        .stat-card.blue .stat-num { color: #2563eb; }
        .stat-card.green .stat-num { color: #16a34a; }
        .stat-card.orange .stat-num { color: #ea580c; }
        .stat-card.gray .stat-num { color: #64748b; }

        /* ============================================================ */
        /* 用户信息条（已登录时显示） */
        /* ============================================================ */
        .user-bar {
            background: #fff;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-bar .avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 20px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .user-bar .avatar img {
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .user-bar .user-meta {
            flex: 1; min-width: 0;
        }
        .user-bar .user-meta .name {
            font-size: 15px; font-weight: 700; color: #1a2b3c;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-bar .user-meta .account {
            font-size: 12px; color: #8a99aa;
            font-family: monospace;
            margin-top: 2px;
        }
        .user-bar .btn-logout {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            min-height: 36px;
            flex-shrink: 0;
        }
        .user-bar .btn-logout:active { background: #fee2e2; }

        /* ============================================================ */
        /* 登录区（未登录时显示，紧凑版） */
        /* ============================================================ */
        .login-card {
            background: linear-gradient(135deg, #eff6ff, #f0f9ff);
            border: 1.5px solid #bfdbfe;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .login-card .login-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .login-card .login-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #1a2b3c;
            display: flex; align-items: center; gap: 6px;
        }
        .login-card .login-title .tag {
            font-size: 10px;
            font-weight: 500;
            color: #3b82f6;
            background: #fff;
            padding: 2px 7px;
            border-radius: 6px;
        }
        .login-card .login-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .login-card .login-row:last-child { margin-bottom: 0; }
        .login-card input {
            flex: 1;
            min-width: 0;
            padding: 9px 12px;
            border: 1px solid #dce4ec;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            outline: none;
            color: #1a2b3c;
            min-height: 40px;
        }
        .login-card input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .login-card .btn-send-sms {
            padding: 0 12px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: #fff;
            font-weight: 600;
            font-size: 12.5px;
            cursor: pointer;
            white-space: nowrap;
            min-height: 40px;
            min-width: 92px;
        }
        .login-card .btn-send-sms:active { opacity: 0.85; }
        .login-card .btn-send-sms:disabled { opacity: 0.5; cursor: not-allowed; }
        .login-card .btn-login {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            min-height: 44px;
            box-shadow: 0 4px 12px rgba(34,197,94,0.25);
            transition: transform .12s;
        }
        .login-card .btn-login:active { transform: scale(0.97); }
        .login-card .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .login-card .login-status {
            margin-top: 8px;
            font-size: 12px;
            color: #67798c;
            text-align: center;
            min-height: 15px;
        }
        .login-card .login-status.error { color: #dc2626; }
        .login-card .login-status.success { color: #16a34a; }

        /* ============================================================ */
        /* 折叠区块 */
        /* ============================================================ */
        .section-fold {
            background: #fff;
            border-radius: 14px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .section-fold .fold-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            cursor: pointer;
            user-select: none;
            transition: background .2s ease;
        }
        .section-fold .fold-head:active { background: #f8fafc; }
        .section-fold .fold-title {
            font-size: 14px;
            font-weight: 700;
            color: #1a2b3c;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-fold .fold-title .icon {
            font-size: 16px;
        }
        .section-fold .fold-title .badge {
            font-size: 11px;
            color: #3b82f6;
            background: #eff6ff;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
        .section-fold .fold-arrow {
            color: #94a3b8;
            font-size: 12px;
            transition: transform .35s cubic-bezier(.22,.61,.36,1);
        }
        .section-fold .fold-arrow.open { transform: rotate(180deg); }
        .section-fold .fold-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height .35s cubic-bezier(.22,.61,.36,1), padding .35s cubic-bezier(.22,.61,.36,1);
            padding: 0 16px;
        }
        .section-fold .fold-body.open {
            padding: 0 16px 16px;
        }

        /* ============================================================ */
        /* 表单 */
        /* ============================================================ */
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #334455; margin-bottom: 6px; }
        .field textarea,
        .field input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dce4ec;
            border-radius: 8px;
            font-size: 13px;
            font-family: monospace;
            background: #f8fafc;
            min-height: 42px;
            resize: vertical;
            outline: none;
            color: #1a2b3c;
        }
        .field textarea:focus,
        .field input:focus { border-color: #3b82f6; background: #fff; }
        .field .hint { font-size: 11px; color: #8a99aa; margin-top: 5px; }

        .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .actions button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            flex: 1;
            min-width: 80px;
            min-height: 44px;
        }
        .actions .btn-save { background: #3b82f6; color: #fff; }
        .actions .btn-test { background: #22c55e; color: #fff; }
        .actions button:active { opacity: 0.85; }
        .actions button:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-msg { margin-top: 12px; padding: 9px 12px; border-radius: 8px; font-size: 12.5px; display: none; }
        .status-msg.success { display: block; background: #e6f7ed; color: #1a7a44; }
        .status-msg.error { display: block; background: #fde8e8; color: #b33a3a; }
        .status-msg.info { display: block; background: #e3edf7; color: #1a5f7a; }

        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-row button {
            flex: 1;
            min-width: 120px;
            padding: 11px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            min-height: 44px;
            color: #fff;
        }
        .btn-row .btn-auto-venues { background: #8b5cf6; }
        .btn-row .btn-refresh-pool { background: #f59e0b; }
        .btn-row .btn-export { background: #0ea5e9; }
        .btn-row .btn-import { background: #14b8a6; }
        .btn-row button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-row button:active:not(:disabled) { opacity: 0.85; }

        .block-hint { font-size: 11px; color: #8a99aa; margin-top: 8px; line-height: 1.5; }

        /* ============================================================ */
        /* 钓场管理 */
        /* ============================================================ */
        .venue-mgr-add { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .venue-mgr-add input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dce4ec;
            border-radius: 8px;
            font-size: 13px;
            background: #f8fafc;
            min-height: 44px;
        }
        .venue-mgr-add .btn-add {
            align-self: flex-end;
            background: #22c55e;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px 22px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            min-height: 44px;
        }
        .btn-pick-from-orders {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            min-height: 44px;
            margin-bottom: 12px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-pick-from-orders:active { transform: scale(0.97); }
        .btn-pick-from-orders:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .venue-mgr-list { display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow-y: auto; }
        .venue-mgr-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .venue-mgr-item .info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
        .venue-mgr-item .info .name { font-weight: 600; color: #1a2b3c; font-size: 14px; }
        .venue-mgr-item .info .order-id { color: #8a99aa; font-size: 11px; font-family: monospace; }
        .venue-mgr-item .btn-del {
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            min-height: 36px;
        }
        .venue-mgr-empty, .venue-mgr-loading { text-align: center; padding: 20px; color: #8a99aa; font-size: 13px; }

        /* ============================================================ */
        /* 订单选择弹层 */
        /* ============================================================ */
        .order-picker-overlay {
            position: fixed; inset: 0;
            background: rgba(8,15,25,0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 2500;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity .25s ease;
            pointer-events: none;
        }
        .order-picker-overlay.show { opacity: 1; pointer-events: auto; }
        .order-picker-panel {
            background: #fff;
            border-radius: 22px 22px 0 0;
            width: 100%;
            max-width: 560px;
            max-height: 78vh;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform .32s cubic-bezier(.32,.72,0,1);
            padding: 8px 0 0;
        }
        .order-picker-overlay.show .order-picker-panel { transform: translateY(0); }
        .order-picker-panel .sheet-handle {
            width: 38px; height: 5px;
            border-radius: 3px;
            background: #e2e8f0;
            margin: 6px auto 12px;
            flex-shrink: 0;
        }
        .order-picker-panel .panel-title {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px 12px;
            border-bottom: 1px solid #eef2f6;
            font-size: 15px; font-weight: 700; color: #1a2b3c;
            flex-shrink: 0;
        }
        .order-picker-panel .panel-title .close-x {
            background: #f1f5f9; border: none; color: #64748b;
            width: 30px; height: 30px; border-radius: 50%;
            font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .order-picker-panel .order-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px 24px;
            -webkit-overflow-scrolling: touch;
        }
        .order-picker-panel .order-item {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border: 1.5px solid transparent;
            transition: all .15s;
        }
        .order-picker-panel .order-item:active { background: #eef2f6; transform: scale(0.98); }
        .order-picker-panel .order-item.already { background: #f0fdf4; border-color: #86efac; }
        .order-picker-panel .order-item .info { flex: 1; min-width: 0; }
        .order-picker-panel .order-item .name {
            font-weight: 600; font-size: 14px; color: #1a2b3c;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .order-picker-panel .order-item .meta {
            font-size: 11px; color: #8a99aa; margin-top: 3px;
            font-family: monospace;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .order-picker-panel .order-item .status-tag {
            font-size: 11px; font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .order-picker-panel .order-item.already .status-tag { background: #22c55e; color: #fff; }
        .order-picker-panel .order-item:not(.already) .status-tag { background: #3b82f6; color: #fff; }
        .order-picker-panel .empty, .order-picker-panel .loading {
            text-align: center; padding: 40px 20px; color: #8a99aa; font-size: 13px;
        }
        .order-picker-panel .loading .spinner {
            width: 28px; height: 28px;
            border: 3px solid #e0e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============================================================ */
        /* 底部导航 */
        /* ============================================================ */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #fff;
            border-top: 1px solid #eef2f6;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 62px;
            z-index: 999;
        }
        .bottom-nav .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 0;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 500;
            text-decoration: none;
            position: relative;
        }
        .bottom-nav .tab .tab-icon { font-size: 19px; line-height: 1.2; }
        .bottom-nav .tab.active .tab-icon,
        .bottom-nav .tab.active .tab-label { color: #1a2b3c; }
        .bottom-nav .tab.active .tab-label { font-weight: 600; }
        .bottom-nav .tab.active::after {
            content: '';
            position: absolute;
            top: 0; left: 30%; right: 30%;
            height: 3px;
            background: #1a2b3c;
            border-radius: 0 0 3px 3px;
        }
    </style>
</head>
<body>
<div class="app-container">

    <!-- 顶部仪表盘 -->
    <div class="dashboard-header">
        <div class="greeting" id="dashboardGreeting">⚙️ 代理配置</div>
        <div class="sub-greeting" id="dashboardSubGreeting">管理您的账号与钓场数据</div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-grid">
        <div class="stat-card blue">
            <div class="stat-num" id="statVenues">0</div>
            <div class="stat-label">钓场数</div>
        </div>
        <div class="stat-card green">
            <div class="stat-num" id="statSeats">0</div>
            <div class="stat-label">钓位池</div>
        </div>
        <div class="stat-card orange">
            <div class="stat-num" id="statStatus">-</div>
            <div class="stat-label">登录状态</div>
        </div>
    </div>

    <!-- 用户信息条（已登录时显示） -->
    <div class="user-bar" id="userBar" style="display:none;">
        <div class="avatar" id="userAvatar">👤</div>
        <div class="user-meta">
            <div class="name" id="userName">-</div>
            <div class="account" id="userAccount">-</div>
        </div>
        <button class="btn-logout" onclick="logout()">退出</button>
    </div>

    <!-- 登录卡片（未登录时显示） -->
    <div class="login-card" id="loginCard">
        <div class="login-head">
            <div class="login-title">
                📱 手机号登录
                <span class="tag">推荐</span>
            </div>
        </div>
        <div class="login-row">
            <input id="loginMobile" type="tel" maxlength="11" placeholder="请输入手机号" inputmode="numeric" />
        </div>
        <div class="login-row">
            <input id="loginSmsCode" type="tel" maxlength="6" placeholder="请输入验证码" inputmode="numeric" />
            <button class="btn-send-sms" id="btnSendSms" onclick="onSendSms()">获取验证码</button>
        </div>
        <button class="btn-login" id="btnSmsLogin" onclick="onSmsLogin()">登 录</button>
        <div class="login-status" id="loginStatus"></div>
    </div>

    <!-- 手动 Token 配置 -->
    <div class="section-fold" id="foldManual">
        <div class="fold-head" onclick="toggleFold('foldManual')">
            <div class="fold-title">
                <span class="icon">🔧</span>
                <span>手动配置 Token</span>
            </div>
            <span class="fold-arrow" id="foldManualArrow">▼</span>
        </div>
        <div class="fold-body" id="foldManualBody">
            <div class="field">
                <label>Token</label>
                <textarea id="tokenInput" placeholder="Bearer ... 或直接粘贴 token" rows="3"></textarea>
                <div class="hint">登录成功后自动填入。也可手动复制 Authorization 头的完整值</div>
            </div>

            <div class="field">
                <label>UUID</label>
                <input id="uuidInput" placeholder="任意非空字符串即可" />
                <div class="hint">测试表明此字段不能为空，内容无实际校验</div>
            </div>

            <div class="actions">
                <button class="btn-save" onclick="saveConfig()">保存配置</button>
                <button class="btn-test" onclick="testConfig()">测试连接</button>
            </div>
            <div id="configStatus" class="status-msg"></div>
        </div>
    </div>

    <!-- 号码池 -->
    <div class="section-fold" id="foldPool">
        <div class="fold-head" onclick="toggleFold('foldPool')">
            <div class="fold-title">
                <span class="icon">🛋️</span>
                <span>号码池</span>

<script>
// ============================================================
// 折叠区块（丝滑版）
// ============================================================
var _foldStates = {};

function toggleFold(foldId) {
    var body = document.getElementById(foldId + 'Body');
    var arrow = document.getElementById(foldId + 'Arrow');
    if (!body || !arrow) return;

    if (_foldStates[foldId]) {
        // 收起：先固定当前高度，再收到 0
        body.style.maxHeight = body.scrollHeight + 'px';
        body.offsetHeight;
        body.style.maxHeight = '0px';
        body.classList.remove('open');
        arrow.classList.remove('open');
        _foldStates[foldId] = false;
    } else {
        // 展开：从 0 到实际高度
        body.style.maxHeight = body.scrollHeight + 'px';
        body.classList.add('open');
        arrow.classList.add('open');
        _foldStates[foldId] = true;
    }
}

function openFold(foldId) {
    if (_foldStates[foldId]) return;
    toggleFold(foldId);
}

// ============================================================
// 顶部仪表盘刷新
// ============================================================
function refreshDashboard() {
    var token = loadData('token', '');
    var name = loadData('user_name', '');
    var account = loadData('user_account', '');
    var avatar = loadData('user_avatar', '');

    // 顶部问候语
    var greetingEl = document.getElementById('dashboardGreeting');
    var subEl = document.getElementById('dashboardSubGreeting');

    if (token && name) {
        greetingEl.textContent = '👋 ' + name;
        subEl.textContent = account || '已登录';
    } else {
        greetingEl.textContent = '⚙️ 代理配置';
        subEl.textContent = '管理您的账号与钓场数据';
    }

    // 用户信息条
    var userBar = document.getElementById('userBar');
    var loginCard = document.getElementById('loginCard');

    if (token && (name || account)) {
        userBar.style.display = 'flex';
        loginCard.style.display = 'none';
        document.getElementById('userName').textContent = name || '已登录';
        document.getElementById('userAccount').textContent = account || '';

        var avatarEl = document.getElementById('userAvatar');
        if (avatar) {
            avatarEl.innerHTML = '<img src="' + escapeHtml(avatar) + '" alt="" onerror="this.style.display=\'none\'">';
        } else {
            avatarEl.innerHTML = '👤';
        }

        document.getElementById('statStatus').textContent = '✓';
        document.getElementById('statStatus').style.color = '#16a34a';
    } else {
        userBar.style.display = 'none';
        loginCard.style.display = 'block';
        document.getElementById('statStatus').textContent = '未登录';
        document.getElementById('statStatus').style.color = '#ea580c';
    }

    // 钓场统计
    var venues = loadVenuesFromLocal() || [];
    document.getElementById('statVenues').textContent = venues.length;
    document.getElementById('venueCount').textContent = venues.length + ' 个';

    // 座位统计
    var seatMap = loadSeatMapFromLocal() || {};
    var totalSeats = 0;
    for (var k in seatMap) {
        if (typeof seatMap[k] === 'object') {
            totalSeats += Object.keys(seatMap[k]).length;
        }
    }
    document.getElementById('statSeats').textContent = totalSeats;
    document.getElementById('poolBadge').textContent = totalSeats + ' 座';
}

// ============================================================
// 手机号登录
// ============================================================
var smsCountdown = 0;
var smsTimer = null;

function setLoginStatus(msg, type) {
    var el = document.getElementById('loginStatus');
    if (!el) return;
    el.textContent = msg;
    el.className = 'login-status' + (type ? ' ' + type : '');
}

async function onSendSms() {
    var mobile = document.getElementById('loginMobile').value.trim();
    if (!/^1\d{10}$/.test(mobile)) {
        setLoginStatus('请输入正确的 11 位手机号', 'error');
        return;
    }
    if (smsCountdown > 0) return;

    var btn = document.getElementById('btnSendSms');
    btn.disabled = true;
    btn.textContent = '发送中...';
    setLoginStatus('正在发送验证码...', '');

    var token = loadData('token', '');
    var uuid = loadData('uuid', '');
    if (window.AndroidBridge && window.AndroidBridge.setAuth) {
        window.AndroidBridge.setAuth(token || '', uuid || '');
    }

    try {
        var result = await callApi('/v2/commonApi/sendLoginCaptcha', 'POST', { mobile: mobile });
        if (result.code === '000') {
            setLoginStatus('✅ 验证码已发送，请查收短信', 'success');
            smsCountdown = 60;
            btn.textContent = smsCountdown + 's';
            smsTimer = setInterval(function() {
                smsCountdown--;
                if (smsCountdown <= 0) {
                    clearInterval(smsTimer);
                    smsTimer = null;
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                } else {
                    btn.textContent = smsCountdown + 's';
                }
            }, 1000);
        } else {
            setLoginStatus('发送失败: ' + (result.msg || '未知错误'), 'error');
            btn.disabled = false;
            btn.textContent = '获取验证码';
        }
    } catch(e) {
        setLoginStatus('发送异常: ' + e.message, 'error');
        btn.disabled = false;
        btn.textContent = '获取验证码';
    }
}

async function onSmsLogin() {
    var mobile = document.getElementById('loginMobile').value.trim();
    var smsCode = document.getElementById('loginSmsCode').value.trim();

    if (!/^1\d{10}$/.test(mobile)) {
        setLoginStatus('请输入正确的 11 位手机号', 'error');
        return;
    }
    if (!smsCode) {
        setLoginStatus('请输入短信验证码', 'error');
        return;
    }

    var btn = document.getElementById('btnSmsLogin');
    btn.disabled = true;
    btn.textContent = '登录中...';
    setLoginStatus('正在登录...', '');

    var uuid = loadData('uuid', '');
    if (window.AndroidBridge && window.AndroidBridge.setAuth) {
        window.AndroidBridge.setAuth('', uuid || '');
    }

    try {
        var result = await callApi('/v2/userApi/auth/smsCodeLogin', 'POST', {
            account: mobile,
            sms_code: smsCode,
            user_type: 'app'
        });

        if (result.code === '000' && result.data && result.data.token) {
            var token = result.data.token;
            var userInfo = result.data;

            saveData('token', token);
            saveData('user_name', userInfo.name || '');
            saveData('user_account', userInfo.account || '');
            saveData('user_avatar', userInfo.avatar || '');
            saveData('user_id', userInfo.user_id || '');

            document.getElementById('tokenInput').value = token;

            if (window.AndroidBridge && window.AndroidBridge.setAuth) {
                window.AndroidBridge.setAuth(token, uuid || '');
            }

            setLoginStatus('✅ 登录成功', 'success');
            refreshDashboard();
        } else {
            setLoginStatus('登录失败: ' + (result.msg || '验证码错误或已过期'), 'error');
        }
    } catch(e) {
        setLoginStatus('登录异常: ' + e.message, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = '登 录';
    }
}

// ============================================================
// 退出登录
// ============================================================
function logout() {
    appConfirm('确定要退出登录吗？', { danger: true, okText: '退出' }).then(function(ok) {
        if (!ok) return;
        saveData('token', '');
        saveData('user_name', '');
        saveData('user_account', '');
        saveData('user_avatar', '');
        saveData('user_id', '');
        if (window.AndroidBridge && window.AndroidBridge.setAuth) {
            window.AndroidBridge.setAuth('', loadData('uuid', ''));
        }
        document.getElementById('tokenInput').value = '';
        document.getElementById('loginMobile').value = '';
        document.getElementById('loginSmsCode').value = '';
        setLoginStatus('', '');
        setStatusMsg('', '');
        refreshDashboard();
    });
}

// ============================================================
// 配置保存与测试
// ============================================================
function setStatusMsg(msg, type) {
    var el = document.getElementById('configStatus');
    if (!el) return;
    el.className = 'status-msg ' + (type || '');
    el.textContent = msg;
}

function saveConfig() {
    var token = document.getElementById('tokenInput').value.trim();
    var uuid = document.getElementById('uuidInput').value.trim();
    if (!token || !uuid) {
        setStatusMsg('Token 和 UUID 不能为空', 'error');
        return;
    }
    saveData('token', token);
    saveData('uuid', uuid);
    if (window.AndroidBridge && window.AndroidBridge.setAuth) {
        window.AndroidBridge.setAuth(token, uuid);
        setStatusMsg('配置已保存，请点击测试连接', 'success');
        refreshDashboard();
    } else {
        setStatusMsg('已保存到本地，但 AndroidBridge 不可用', 'info');
    }
}

async function testConfig() {
    var token = document.getElementById('tokenInput').value.trim();
    var uuid = document.getElementById('uuidInput').value.trim();
    if (!token || !uuid) {
        setStatusMsg('请先填写 Token 和 UUID', 'error');
        return;
    }
    if (!window.AndroidBridge) {
        setStatusMsg('AndroidBridge 未注入', 'error');
        return;
    }
    setStatusMsg('测试中...', 'info');
    saveData('token', token);
    saveData('uuid', uuid);
    if (window.AndroidBridge.setAuth) {
        window.AndroidBridge.setAuth(token, uuid);
    }
    try {
        var result = await callApi('/v2/userApi/order/getMyTicketOrderList?tab=10&page=1&limit=20', 'GET');
        if (result.code === '000') {
            setStatusMsg('测试成功，Token 和 UUID 有效', 'success');
        } else {
            setStatusMsg('测试失败: ' + (result.msg || 'Token 无效'), 'error');
        }
    } catch(e) {
        setStatusMsg('测试异常: ' + e.message, 'error');
    }
}

// ============================================================
// 钓场管理
// ============================================================
function loadVenuesFromLocal() {
    try {
        if (window.AndroidBridge && window.AndroidBridge.loadVenues) {
            var json = window.AndroidBridge.loadVenues();
            if (json && json !== '[]') return JSON.parse(json);
        }
        var stored = loadData('venues_data', '');
        if (stored) return JSON.parse(stored);
    } catch(e) {}
    return null;
}

function saveVenuesToLocal(venues) {
    var json = JSON.stringify(venues);
    if (window.AndroidBridge && window.AndroidBridge.saveVenues) {
        window.AndroidBridge.saveVenues(json);
    }
    saveData('venues_data', json);
    refreshDashboard();
}

async function loadVenueList() {
    var listEl = document.getElementById('venueMgrList');
    listEl.innerHTML = '<div class="venue-mgr-loading">加载中...</div>';
    var venues = loadVenuesFromLocal();
    if (venues === null) {
        try {
            var resp = await fetch('venues.json');
            venues = await resp.json();
            saveVenuesToLocal(venues);
        } catch(e) {
            venues = [];
        }
    }
    renderVenueList(venues);
    refreshDashboard();
}

function renderVenueList(venues) {
    var listEl = document.getElementById('venueMgrList');
    var countEl = document.getElementById('venueCount');
    countEl.textContent = venues.length + ' 个';
    if (!venues || venues.length === 0) {
        listEl.innerHTML = '<div class="venue-mgr-empty">暂无钓场</div>';
        return;
    }
    var html = '';
    venues.forEach(function(v) {
        html += '<div class="venue-mgr-item">' +
            '<div class="info">' +
                '<span class="name">' + escapeHtml(v.name) + '</span>' +
                '<span class="order-id">ID: ' + escapeHtml(v.order_id) + '</span>' +
            '</div>' +
            '<button class="btn-del" onclick="deleteVenue(' + v.id + ')">删除</button>' +
        '</div>';
    });
    listEl.innerHTML = html;
}

async function addVenue() {
    var nameInput = document.getElementById('venueNameInput');
    var orderIdInput = document.getElementById('venueOrderIdInput');
    var name = nameInput.value.trim();
    var order_id = orderIdInput.value.trim();
    if (!name || !order_id) {
        await appAlert('请填写完整的钓场名称和订单 ID');
        return;
    }
    var venues = loadVenuesFromLocal() || [];
    if (venues.some(function(v) { return v.order_id === order_id; })) {
        await appAlert('该订单 ID 已存在，请勿重复添加');
        return;
    }
    var maxId = venues.reduce(function(max, v) { return Math.max(max, v.id || 0); }, 0);
    venues.push({ id: maxId + 1, name: name, order_id: order_id, enabled: true, sort: maxId + 1, remark: '' });
    saveVenuesToLocal(venues);
    nameInput.value = '';
    orderIdInput.value = '';
    renderVenueList(venues);
}

async function deleteVenue(id) {
    var ok = await appConfirm('确定要删除该钓场吗？此操作不可撤销', { danger: true, okText: '删除' });
    if (!ok) return;
    var venues = loadVenuesFromLocal() || [];
    venues = venues.filter(function(v) { return v.id !== id; });
    saveVenuesToLocal(venues);
    renderVenueList(venues);
}

// ============================================================
// 从订单列表中选择钓场
// ============================================================
var _orderPickerList = [];

async function openOrderPicker() {
    var overlay = document.getElementById('orderPickerOverlay');
    var listEl = document.getElementById('orderPickerList');

    overlay.classList.add('show');
    listEl.innerHTML = '<div class="loading"><div class="spinner"></div>正在加载订单...</div>';

    var token = loadData('token', '');
    var uuid = loadData('uuid', '');
    if (!token || !uuid) {
        listEl.innerHTML = '<div class="empty">请先登录或配置 Token</div>';
        return;
    }
    if (window.AndroidBridge && window.AndroidBridge.setAuth) {
        window.AndroidBridge.setAuth(token, uuid);
    }

    try {
        var result = await callApi('/v2/userApi/order/getMyTicketOrderList?tab=10&page=1&limit=50', 'GET');
        if (result.code !== '000') {
            listEl.innerHTML = '<div class="empty">加载失败: ' + escapeHtml(result.msg || '未知错误') + '</div>';
            return;
        }

        var orders = (result.data && result.data.list) || [];
        var seen = {};
        var uniqueOrders = [];
        orders.forEach(function(o) {
            var pid = o.product_id;
            if (!pid || seen[pid]) return;
            seen[pid] = true;
            uniqueOrders.push(o);
        });

        uniqueOrders.forEach(function(o) {
            var venueName = '';
            if (o.merchant_model && o.merchant_model.mer_name) {
                venueName = o.merchant_model.mer_name;
            } else if (o.order_ticket_item && o.order_ticket_item.product_info && o.order_ticket_item.product_info.title) {
                venueName = o.order_ticket_item.product_info.title;
            }
            o._venueName = venueName || '未知钓场';
        });

        var existingVenues = loadVenuesFromLocal() || [];
        var existingOrderIds = {};
        existingVenues.forEach(function(v) { existingOrderIds[String(v.order_id)] = true; });

        _orderPickerList = uniqueOrders;

        if (uniqueOrders.length === 0) {
            listEl.innerHTML = '<div class="empty">没有找到任何订单</div>';
            return;
        }

        var html = '';
        uniqueOrders.forEach(function(o, idx) {
            var already = existingOrderIds[String(o.order_id)];
            html += '<div class="order-item ' + (already ? 'already' : '') + '" data-idx="' + idx + '">' +
                '<div class="info">' +
                    '<div class="name">' + escapeHtml(o._venueName) + '</div>' +
                    '<div class="meta">订单ID: ' + escapeHtml(o.order_id) + '</div>' +
                '</div>' +
                '<span class="status-tag">' + (already ? '已添加' : '添加') + '</span>' +
            '</div>';
        });
        listEl.innerHTML = html;

        listEl.querySelectorAll('.order-item').forEach(function(el) {
            el.addEventListener('click', function() {
                var idx = parseInt(el.getAttribute('data-idx'), 10);
                if (isNaN(idx)) return;
                pickOrder(idx);
            });
        });

    } catch(e) {
        listEl.innerHTML = '<div class="empty">加载异常: ' + escapeHtml(e.message || '') + '</div>';
    }
}

async function pickOrder(idx) {
    var order = _orderPickerList[idx];
    if (!order) return;

    var venueName = order._venueName;
    var orderId = String(order.order_id);

    var venues = loadVenuesFromLocal() || [];
    if (venues.some(function(v) { return String(v.order_id) === orderId; })) {
        await appAlert('该订单 ID 已存在，无需重复添加');
        return;
    }

    var maxId = venues.reduce(function(max, v) { return Math.max(max, v.id || 0); }, 0);
    venues.push({
        id: maxId + 1,
        name: venueName,
        order_id: orderId,
        enabled: true,
        sort: maxId + 1,
        remark: ''
    });
    saveVenuesToLocal(venues);
    renderVenueList(venues);

    await openOrderPicker();
}

function closeOrderPicker() {
    document.getElementById('orderPickerOverlay').classList.remove('show');
}

document.getElementById('orderPickerOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeOrderPicker();
});

// ============================================================
// 导出配置
// ============================================================
async function exportConfig() {
    var btn = document.getElementById('btnExport');
    var statusEl = document.getElementById('backupStatus');

    if (!window.AndroidBridge || !window.AndroidBridge.exportConfig) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'AndroidBridge.exportConfig 未注入';
        return;
    }

    btn.disabled = true;
    btn.textContent = '导出中...';
    statusEl.className = 'status-msg info';
    statusEl.textContent = '正在打包配置...';

    try {
        var venuesJson = window.AndroidBridge.loadVenues();
        var seatMapJson = window.AndroidBridge.loadSeatMap();

        var config = {
            _meta: {
                exportTime: new Date().toISOString(),
                version: '1.0'
            },
            venues: JSON.parse(venuesJson || '[]'),
            seatMap: JSON.parse(seatMapJson || '{}')
        };

        var filename = 'fishing-config-' + Date.now() + '.json';
        var content = JSON.stringify(config, null, 2);

        var result = window.AndroidBridge.exportConfig(content, filename);

        if (result && result.indexOf('ERROR') === 0) {
            statusEl.className = 'status-msg error';
            statusEl.textContent = '导出失败: ' + result;
        } else {
            statusEl.className = 'status-msg success';
            statusEl.textContent = '导出成功，文件已保存到: ' + result;
        }
    } catch(e) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '导出异常: ' + e.message;
    } finally {
        btn.disabled = false;
        btn.textContent = '导出配置';
    }
}

// ============================================================
// 导入配置
// ============================================================
var importPending = false;

function importConfig() {
    var statusEl = document.getElementById('backupStatus');
    if (!window.AndroidBridge || !window.AndroidBridge.pickFileForImport) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'AndroidBridge.pickFileForImport 未注入';
        return;
    }
    importPending = true;
    statusEl.className = 'status-msg info';
    statusEl.textContent = '请选择要导入的配置文件...';
    window.AndroidBridge.pickFileForImport();
}

window._onImportFileSelected = async function(content) {
    var statusEl = document.getElementById('backupStatus');
    if (!importPending) return;
    importPending = false;

    if (!content || content === '') {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '未选择文件或文件内容为空';
        return;
    }

    try {
        var config = JSON.parse(content);
        if (!config.venues && !config.seatMap) {
            statusEl.className = 'status-msg error';
            statusEl.textContent = '文件格式不正确（缺少 venues 或 seatMap）';
            return;
        }

        var ok = await appConfirm('将覆盖当前的钓场列表和号码池，确定导入？', { danger: true, okText: '覆盖导入' });
        if (!ok) {
            statusEl.className = 'status-msg info';
            statusEl.textContent = '已取消导入';
            return;
        }

        if (config.venues) {
            var venuesJson = JSON.stringify(config.venues);
            window.AndroidBridge.saveVenues(venuesJson);
            saveData('venues_data', venuesJson);
        }
        if (config.seatMap) {
            var seatMapJson = JSON.stringify(config.seatMap);
            window.AndroidBridge.saveSeatMap(seatMapJson);
        }

        loadVenueList();

        statusEl.className = 'status-msg success';
        statusEl.textContent = '导入成功！钓场: ' + (config.venues ? config.venues.length : 0) + ' 个，号码池已覆盖';
    } catch(e) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '导入失败: ' + e.message;
    }
};

// ============================================================
// 自动生成钓场库
// ============================================================
async function autoGenerateVenues() {
    var btn = document.getElementById('btnAutoVenues');
    var statusEl = document.getElementById('poolStatus');
    var token = loadData('token', '');
    var uuid = loadData('uuid', '');

    if (!token || !uuid) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '请先登录或配置 Token 和 UUID';
        return;
    }
    if (!window.AndroidBridge) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'AndroidBridge 未注入';
        return;
    }
    var confirmed = await appConfirm('将根据历史订单重新生成钓场库，覆盖现有钓场列表，确定继续？', { okText: '继续' });
    if (!confirmed) return;

    if (window.AndroidBridge.setAuth) window.AndroidBridge.setAuth(token, uuid);
    btn.disabled = true;
    btn.textContent = '分析中...';
    statusEl.className = 'status-msg info';
    statusEl.textContent = '正在获取历史订单...';

    try {
        var firstPage = await callApi('/v2/userApi/order/getMyTicketOrderList?tab=10&page=1&limit=10', 'GET');
        if (firstPage.code !== '000') {
            throw new Error(firstPage.msg || '获取订单失败');
        }

        var totalCount = firstPage.data.count || 0;
        var totalPages = Math.ceil(totalCount / 10);
        if (totalPages === 0) totalPages = 1;

        statusEl.textContent = '共 ' + totalCount + ' 个订单，正在分析...';

        var venueMap = {};

        for (var page = 1; page <= totalPages; page++) {
            var pageResult;
            if (page === 1) {
                pageResult = firstPage;
            } else {
                pageResult = await callApi('/v2/userApi/order/getMyTicketOrderList?tab=10&page=' + page + '&limit=10', 'GET');
                if (pageResult.code !== '000') continue;
            }

            var orders = pageResult.data.list || [];
            for (var i = 0; i < orders.length; i++) {
                var order = orders[i];
                var productId = order.product_id;
                var orderId = order.order_id;
                if (!productId) continue;
                if (venueMap[productId]) continue;

                var venueName = null;
                if (order.merchant_model && order.merchant_model.mer_name) {
                    venueName = order.merchant_model.mer_name;
                } else if (order.order_ticket_item && order.order_ticket_item.product_info && order.order_ticket_item.product_info.title) {
                    venueName = order.order_ticket_item.product_info.title;
                }

                if (venueName) {
                    venueMap[productId] = {
                        name: venueName,
                        order_id: orderId
                    };
                }
            }

            statusEl.textContent = '分析中... ' + page + '/' + totalPages;
            await new Promise(function(r) { setTimeout(r, 200); });
        }

        var venues = [];
        var id = 1;
        for (var pid in venueMap) {
            venues.push({
                id: id++,
                name: venueMap[pid].name,
                order_id: venueMap[pid].order_id,
                enabled: true,
                sort: id,
                remark: ''
            });
        }

        if (venues.length === 0) {
            statusEl.className = 'status-msg error';
            statusEl.textContent = '没有找到任何钓场信息';
            return;
        }

        saveVenuesToLocal(venues);
        statusEl.className = 'status-msg success';
        statusEl.textContent = '已生成 ' + venues.length + ' 个钓场，正在刷新号码池...';

        renderVenueList(venues);

        await refreshSeatMap();

    } catch(e) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '生成失败: ' + e.message;
    } finally {
        btn.disabled = false;
        btn.textContent = '自动生成钓场库';
    }
}

// ============================================================
// 刷新号码池
// ============================================================
async function refreshSeatMap() {
    var btn = document.getElementById('btnRefreshPool');
    var statusEl = document.getElementById('poolStatus');
    var token = loadData('token', '');
    var uuid = loadData('uuid', '');
    if (!token || !uuid) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '请先登录或配置 Token 和 UUID';
        return;
    }
    if (!window.AndroidBridge) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'AndroidBridge 未注入';
        return;
    }
    if (window.AndroidBridge.setAuth) window.AndroidBridge.setAuth(token, uuid);
    btn.disabled = true;
    btn.textContent = '刷新中...';
    statusEl.className = 'status-msg info';
    statusEl.textContent = '正在刷新号码池...';
    try {
        var venues = loadVenuesFromLocal() || [];
        if (venues.length === 0) {
            statusEl.className = 'status-msg error';
            statusEl.textContent = '钓场列表为空';
            btn.disabled = false;
            btn.textContent = '刷新号码池';
            return;
        }
        var seatMap = {};
        var totalSeats = 0;
        var totalVenues = 0;
        var failedVenues = [];
        for (var i = 0; i < venues.length; i++) {
            var venue = venues[i];
            try {
                var result = await callApi('/v2/userApi/ticketSeat/querySeatList?order_id=' + venue.order_id, 'GET');
                if (result.code === '000' && result.data && result.data.seat_list) {
                    var map = {};
                    result.data.seat_list.forEach(function(seat) {
                        map[seat.seat_number] = seat.product_ticket_seat_id;
                    });
                    seatMap[venue.name] = map;
                    totalSeats += result.data.seat_list.length;
                    totalVenues++;
                } else {
                    failedVenues.push(venue.name);
                }
            } catch(e) {
                failedVenues.push(venue.name);
            }
            await new Promise(function(r) { setTimeout(r, 500); });
        }
        var seatMapJson = JSON.stringify(seatMap);
        if (window.AndroidBridge && window.AndroidBridge.saveSeatMap) {
            window.AndroidBridge.saveSeatMap(seatMapJson);
        }
        saveData('seat_map_data', seatMapJson);
        statusEl.className = 'status-msg success';
        statusEl.textContent = '号码池已刷新: ' + totalSeats + ' 个座位, ' + totalVenues + ' 个钓场' + (failedVenues.length > 0 ? ', 跳过: ' + failedVenues.join('、') : '');
        refreshDashboard();
    } catch(e) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '刷新失败: ' + e.message;
    } finally {
        btn.disabled = false;
        btn.textContent = '刷新号码池';
    }
}

// ============================================================
// 初始化
// ============================================================
(function initConfigPage() {
    var savedToken = loadData('token', '');
    var savedUuid = loadData('uuid', '');
    document.getElementById('tokenInput').value = savedToken;
    document.getElementById('uuidInput').value = savedUuid;

    if (!savedUuid) {
        var autoUuid = String(Date.now());
        document.getElementById('uuidInput').value = autoUuid;
        saveData('uuid', autoUuid);
    }

    if (savedToken) {
        if (window.AndroidBridge && window.AndroidBridge.setAuth) {
            window.AndroidBridge.setAuth(savedToken, loadData('uuid', ''));
        }
    }

    loadVenueList();
    refreshDashboard();

    // 页面切回来时刷新
    window.addEventListener('pageshow', function() {
        refreshDashboard();
    });
})();
</script>
