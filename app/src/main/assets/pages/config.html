<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>配置 - 渔榜助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: #f5f7fa; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
        .app-container { max-width: 800px; width: 100%; padding: 12px 12px 100px; }
        .config-container { background: #fff; border-radius: 14px; padding: 22px 18px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
        .page-title { font-size: 19px; font-weight: 700; color: #1a2b3c; margin-bottom: 4px; }
        .page-subtitle { color: #8a99aa; font-size: 13px; margin-bottom: 22px; }

        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #334455; margin-bottom: 6px; }
        .field textarea,
        .field input { width: 100%; padding: 10px 12px; border: 1px solid #dce4ec; border-radius: 8px; font-size: 13px; font-family: monospace; background: #f8fafc; min-height: 42px; resize: vertical; outline: none; color: #1a2b3c; }
        .field textarea:focus,
        .field input:focus { border-color: #3b82f6; background: #fff; }
        .field .hint { font-size: 11px; color: #8a99aa; margin-top: 5px; }

        .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .actions button { padding: 10px 16px; border-radius: 8px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; flex: 1; min-width: 80px; min-height: 44px; }
        .actions .btn-save { background: #3b82f6; color: #fff; }
        .actions .btn-test { background: #22c55e; color: #fff; }
        .actions button:active { opacity: 0.85; }

        .status-msg { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; }
        .status-msg.success { display: block; background: #e6f7ed; color: #1a7a44; }
        .status-msg.error { display: block; background: #fde8e8; color: #b33a3a; }
        .status-msg.info { display: block; background: #e3edf7; color: #1a5f7a; }

        .section-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid #eef2f6; }
        .section-block .section-label { font-size: 14px; font-weight: 700; color: #1a2b3c; margin-bottom: 12px; }

        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-row button { flex: 1; min-width: 120px; padding: 11px 16px; border-radius: 8px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; min-height: 44px; color: #fff; }
        .btn-row .btn-auto-venues { background: #8b5cf6; }
        .btn-row .btn-refresh-pool { background: #f59e0b; }
        .btn-row .btn-export { background: #0ea5e9; }
        .btn-row .btn-import { background: #14b8a6; }
        .btn-row button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-row button:active:not(:disabled) { opacity: 0.85; }

        .block-hint { font-size: 11px; color: #8a99aa; margin-top: 8px; line-height: 1.5; }

        .venue-mgr-section { margin-top: 22px; border-top: 1px solid #eef2f6; padding-top: 18px; }
        .venue-mgr-section .section-title { font-size: 15px; font-weight: 700; color: #1a2b3c; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .venue-mgr-section .count-badge { background: #eef2f6; color: #334455; font-size: 12px; padding: 2px 10px; border-radius: 12px; }
        .venue-dropdown-wrapper { border: 1px solid #eef2f6; border-radius: 10px; overflow: hidden; background: #f8fafc; }
        .venue-dropdown-header { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; cursor: pointer; background: #fff; }
        .venue-dropdown-header .title { font-weight: 600; color: #1a2b3c; font-size: 14px; }
        .venue-dropdown-header .arrow { color: #94a3b8; font-size: 12px; transition: transform .2s; }
        .venue-dropdown-header .arrow.open { transform: rotate(180deg); }
        .venue-dropdown-body { max-height: 0; overflow: hidden; transition: max-height .3s ease; padding: 0 16px; background: #fff; }
        .venue-dropdown-body.open { padding: 12px 16px 16px; }
        .venue-mgr-add { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .venue-mgr-add input { width: 100%; padding: 10px 12px; border: 1px solid #dce4ec; border-radius: 8px; font-size: 13px; background: #f8fafc; min-height: 44px; }
        .venue-mgr-add .btn-add { align-self: flex-end; background: #22c55e; color: #fff; border: none; border-radius: 8px; padding: 9px 22px; font-weight: 600; font-size: 13px; cursor: pointer; min-height: 44px; }
        /* 【新增】从订单选择按钮 */
        .btn-pick-from-orders {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            min-height: 44px;
            margin-bottom: 12px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-pick-from-orders:active { transform: scale(0.97); }
        .btn-pick-from-orders:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .venue-mgr-list { display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow-y: auto; }
        .venue-mgr-item { background: #f8fafc; border-radius: 8px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
        .venue-mgr-item .info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
        .venue-mgr-item .info .name { font-weight: 600; color: #1a2b3c; font-size: 14px; }
        .venue-mgr-item .info .order-id { color: #8a99aa; font-size: 11px; font-family: monospace; }
        .venue-mgr-item .btn-del { background: #ef4444; color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; min-height: 36px; }
        .venue-mgr-empty, .venue-mgr-loading { text-align: center; padding: 20px; color: #8a99aa; font-size: 13px; }

        /* 【新增】订单选择弹层 */
        .order-picker-overlay {
            position: fixed; inset: 0;
            background: rgba(8,15,25,0.55);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            z-index: 2500;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity .25s ease;
            pointer-events: none;
        }
        .order-picker-overlay.show { opacity: 1; pointer-events: auto; }
        .order-picker-panel {
            background: #fff;
            border-radius: 22px 22px 0 0;
            width: 100%;
            max-width: 560px;
            max-height: 78vh;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform .32s cubic-bezier(.32,.72,0,1);
            padding: 8px 0 0;
        }
        .order-picker-overlay.show .order-picker-panel { transform: translateY(0); }
        .order-picker-panel .sheet-handle { width: 38px; height: 5px; border-radius: 3px; background: #e2e8f0; margin: 6px auto 12px; flex-shrink: 0; }
        .order-picker-panel .panel-title {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px 12px;
            border-bottom: 1px solid #eef2f6;
            font-size: 15px; font-weight: 700; color: #1a2b3c;
            flex-shrink: 0;
        }
        .order-picker-panel .panel-title .close-x {
            background: #f1f5f9; border: none; color: #64748b;
            width: 30px; height: 30px; border-radius: 50%;
            font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .order-picker-panel .order-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px 24px;
            -webkit-overflow-scrolling: touch;
        }
        .order-picker-panel .order-item {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border: 1.5px solid transparent;
            transition: all .15s;
        }
        .order-picker-panel .order-item:active { background: #eef2f6; transform: scale(0.98); }
        .order-picker-panel .order-item.already {
            background: #f0fdf4;
            border-color: #86efac;
        }
        .order-picker-panel .order-item .info { flex: 1; min-width: 0; }
        .order-picker-panel .order-item .name {
            font-weight: 600; font-size: 14px; color: #1a2b3c;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .order-picker-panel .order-item .meta {
            font-size: 11px; color: #8a99aa; margin-top: 3px;
            font-family: monospace;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .order-picker-panel .order-item .status-tag {
            font-size: 11px; font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .order-picker-panel .order-item.already .status-tag { background: #22c55e; color: #fff; }
        .order-picker-panel .order-item:not(.already) .status-tag { background: #3b82f6; color: #fff; }
        .order-picker-panel .empty, .order-picker-panel .loading {
            text-align: center; padding: 40px 20px; color: #8a99aa; font-size: 13px;
        }
        .order-picker-panel .loading .spinner {
            width: 28px; height: 28px; border: 3px solid #e0e8f0; border-top-color: #3b82f6;
            border-radius: 50%; animation: spin .8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eef2f6; display: flex; justify-content: space-around; align-items: center; height: 62px; z-index: 999; }
        .bottom-nav .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 0; color: #94a3b8; font-size: 11px; font-weight: 500; text-decoration: none; position: relative; }
        .bottom-nav .tab .tab-icon { font-size: 19px; line-height: 1.2; }
        .bottom-nav .tab.active .tab-icon, .bottom-nav .tab.active .tab-label { color: #1a2b3c; }
        .bottom-nav .tab.active .tab-label { font-weight: 600; }
        .bottom-nav .tab.active::after { content: ''; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; background: #1a2b3c; border-radius: 0 0 3px 3px; }

        .app-dialog-mask { position: fixed; inset: 0; background: rgba(8,15,25,0.5); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 30px; opacity: 0; transition: opacity .2s ease; }
        .app-dialog-mask.show { opacity: 1; }
        .app-dialog-card { background: #fff; border-radius: 18px; width: 100%; max-width: 320px; padding: 26px 22px 18px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); transform: translateY(20px) scale(.94); opacity: 0; transition: transform .28s cubic-bezier(.34,1.4,.64,1), opacity .22s ease; }
        .app-dialog-mask.show .app-dialog-card { transform: translateY(0) scale(1); opacity: 1; }
        .app-dialog-title { font-size: 16px; font-weight: 700; color: #1a2b3c; margin-bottom: 8px; }
        .app-dialog-msg { font-size: 13.5px; color: #67798c; line-height: 1.6; margin-bottom: 20px; white-space: pre-line; word-break: break-word; }
        .app-dialog-btns { display: flex; gap: 10px; }
        .app-dialog-btn { flex: 1; border: none; border-radius: 10px; padding: 12px 10px; font-size: 14.5px; font-weight: 600; cursor: pointer; min-height: 46px; transition: transform .12s; }
        .app-dialog-btn:active { transform: scale(.95); }
        .app-dialog-btn.primary { background: #3b82f6; color: #fff; }
        .app-dialog-btn.danger { background: #ef4444; color: #fff; }
        .app-dialog-btn.secondary { background: #eef2f6; color: #334455; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="page active" id="pageConfig">
        <div class="config-container">
            <div class="page-title">代理配置</div>
            <div class="page-subtitle">配置 Token 和 UUID（已加密存储）</div>

            <div class="field">
                <label>Token</label>
                <textarea id="tokenInput" placeholder="Bearer ..."></textarea>
                <div class="hint">复制 Authorization 头的完整值</div>
            </div>

            <div class="field">
                <label>UUID</label>
                <input id="uuidInput" placeholder="1776084841949" />
                <div class="hint">复制 uuid 头的值</div>
            </div>

            <div class="actions">
                <button class="btn-save" onclick="saveConfig()">保存配置</button>
                <button class="btn-test" onclick="testConfig()">测试连接</button>
            </div>
            <div id="configStatus" class="status-msg"></div>

            <div class="section-block">
                <div class="section-label">号码池</div>
                <div class="btn-row">
                    <button class="btn-auto-venues" id="btnAutoVenues" onclick="autoGenerateVenues()">自动生成钓场库</button>
                    <button class="btn-refresh-pool" id="btnRefreshPool" onclick="refreshSeatMap()">刷新号码池</button>
                </div>
                <div id="poolStatus" class="status-msg"></div>
            </div>

            <div class="section-block">
                <div class="section-label">配置备份</div>
                <div class="btn-row">
                    <button class="btn-export" id="btnExport" onclick="exportConfig()">导出配置</button>
                    <button class="btn-import" id="btnImport" onclick="importConfig()">导入配置</button>
                </div>
                <div class="block-hint">导出后文件保存在手机「下载」目录；导入时从系统文件选择器选择 JSON 文件。</div>
                <div id="backupStatus" class="status-msg"></div>
            </div>

            <div class="venue-mgr-section">
                <div class="section-title">
                    <span>钓场管理</span>
                    <span class="count-badge" id="venueCount">0 个</span>
                </div>
                <div class="venue-dropdown-wrapper">
                    <div class="venue-dropdown-header" id="venueDropdownToggle">
                        <span class="title">管理钓场列表</span>
                        <span class="arrow" id="dropdownArrow">▼</span>
                    </div>
                    <div class="venue-dropdown-body" id="venueDropdownBody">
                        <!-- 【新增】从订单选择按钮 -->
                        <button class="btn-pick-from-orders" id="btnPickFromOrders" onclick="openOrderPicker()">
                            <span>📋</span>
                            <span>从我的订单中选择</span>
                        </button>

                        <div class="venue-mgr-add">
                            <input id="venueNameInput" placeholder="钓场名称（手动输入）" />
                            <input id="venueOrderIdInput" placeholder="订单 ID（手动输入）" />
                            <button class="btn-add" onclick="addVenue()">添加</button>
                        </div>
                        <div class="venue-mgr-list" id="venueMgrList">
                            <div class="venue-mgr-loading">加载中...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 【新增】订单选择弹层 -->
<div class="order-picker-overlay" id="orderPickerOverlay">
    <div class="order-picker-panel">
        <div class="sheet-handle"></div>
        <div class="panel-title">
            <span>选择钓场（从订单）</span>
            <button class="close-x" onclick="closeOrderPicker()">✕</button>
        </div>
        <div class="order-list" id="orderPickerList">
            <div class="loading"><div class="spinner"></div>加载中...</div>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <a class="tab" href="lucky.html"><span class="tab-icon">🎯</span><span class="tab-label">幸运号码</span></a>
    <a class="tab" href="detective.html"><span class="tab-icon">🕵️</span><span class="tab-label">钓场侦探</span></a>
    <a class="tab active" href="config.html"><span class="tab-icon">⚙️</span><span class="tab-label">配置</span></a>
</div>

<script src="../assets/common.js"></script>
<script>
// ============================================================
// 原生风格弹窗
// ============================================================
function appDialog(opts) {
    return new Promise(function(resolve) {
        var mask = document.createElement('div');
        mask.className = 'app-dialog-mask';
        var btnsHtml = '';
        opts.buttons.forEach(function(b, i) {
            btnsHtml += '<button class="app-dialog-btn ' + (b.type || 'secondary') + '" data-i="' + i + '">' + b.text + '</button>';
        });
        mask.innerHTML =
            '<div class="app-dialog-card">' +
                '<div class="app-dialog-title">' + opts.title + '</div>' +
                '<div class="app-dialog-msg">' + opts.message + '</div>' +
                '<div class="app-dialog-btns">' + btnsHtml + '</div>' +
            '</div>';
        document.body.appendChild(mask);
        requestAnimationFrame(function() { mask.classList.add('show'); });

        function close(val) {
            mask.classList.remove('show');
            setTimeout(function() { mask.remove(); }, 220);
            resolve(val);
        }
        mask.querySelectorAll('.app-dialog-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var idx = parseInt(btn.getAttribute('data-i'), 10);
                close(opts.buttons[idx].value);
            });
        });
    });
}

function appAlert(message, opts) {
    opts = opts || {};
    return appDialog({
        title: opts.title || '提示',
        message: message,
        buttons: [{ text: opts.okText || '知道了', type: 'primary', value: true }]
    });
}

function appConfirm(message, opts) {
    opts = opts || {};
    return appDialog({
        title: opts.title || '请确认',
        message: message,
        buttons: [
            { text: opts.cancelText || '取消', type: 'secondary', value: false },
            { text: opts.okText || '确定', type: opts.danger ? 'danger' : 'primary', value: true }
        ]
    });
}

// ============================================================
// 下拉展开
// ============================================================
var dropdownToggle = document.getElementById('venueDropdownToggle');
var dropdownBody = document.getElementById('venueDropdownBody');
var dropdownArrow = document.getElementById('dropdownArrow');
var isDropdownOpen = false;

dropdownToggle.addEventListener('click', function() {
    if (isDropdownOpen) {
        dropdownBody.style.maxHeight = dropdownBody.scrollHeight + 'px';
        void dropdownBody.offsetHeight;
        dropdownBody.style.maxHeight = '0px';
        dropdownArrow.classList.remove('open');
        isDropdownOpen = false;
    } else {
        dropdownBody.style.maxHeight = dropdownBody.scrollHeight + 'px';
        dropdownArrow.classList.add('open');
        isDropdownOpen = true;
    }
});

dropdownBody.addEventListener('transitionend', function(e) {
    if (e.propertyName === 'max-height' && isDropdownOpen) {
        dropdownBody.style.maxHeight = 'none';
    }
});

// ============================================================
// 配置保存与测试
// ============================================================
function setStatusMsg(msg, type) {
    var el = document.getElementById('configStatus');
    el.className = 'status-msg ' + type;
    el.textContent = msg;
}

function saveConfig() {
    var token = document.getElementById('tokenInput').value.trim();
    var uuid = document.getElementById('uuidInput').value.trim();
    if (!token || !uuid) {
        setStatusMsg('Token 和 UUID 不能为空', 'error');
        return;
    }
    saveData('token', token);
    saveData('uuid', uuid);
    if (window.AndroidBridge && window.AndroidBridge.setAuth) {
        window.AndroidBridge.setAuth(token, uuid);
        setStatusMsg('配置已保存，请点击测试连接', 'success');
    } else {
        setStatusMsg('已保存到本地，但 AndroidBridge 不可用', 'info');
    }
}

async function testConfig() {
    var token = document.getElementById('tokenInput').value.trim();
    var uuid = document.getElementById('uuidInput').value.trim();
    if (!token || !uuid) {
        setStatusMsg('请先填写 Token 和 UUID', 'error');
        return;
    }
    if (!window.AndroidBridge) {
        setStatusMsg('AndroidBridge 未注入', 'error');
        return;
    }
    setStatusMsg('测试中...', 'info');
    saveData('token', token);
    saveData('uuid', uuid);
    if (window.AndroidBridge.setAuth) {
        window.AndroidBridge.setAuth(token, uuid);
    }
    try {
        var result = await callApi('/v2/userApi/order/getMyTicketOrderList?tab=10&page=1&limit=20', 'GET');
        if (result.code === '000') {
            setStatusMsg('测试成功，Token 和 UUID 有效', 'success');
        } else {
            setStatusMsg('测试失败: ' + (result.msg || 'Token 无效'), 'error');
        }
    } catch(e) {
        setStatusMsg('测试异常: ' + e.message, 'error');
    }
}

// ============================================================
// 钓场管理
// ============================================================
function loadVenuesFromLocal() {
    try {
        if (window.AndroidBridge && window.AndroidBridge.loadVenues) {
            var json = window.AndroidBridge.loadVenues();
            if (json && json !== '[]') return JSON.parse(json);
        }
        var stored = loadData('venues_data', '');
        if (stored) return JSON.parse(stored);
    } catch(e) {}
    return null;
}

function saveVenuesToLocal(venues) {
    var json = JSON.stringify(venues);
    if (window.AndroidBridge && window.AndroidBridge.saveVenues) {
        window.AndroidBridge.saveVenues(json);
    }
    saveData('venues_data', json);
}

async function loadVenueList() {
    var listEl = document.getElementById('venueMgrList');
    listEl.innerHTML = '<div class="venue-mgr-loading">加载中...</div>';
    var venues = loadVenuesFromLocal();
    if (venues === null) {
        try {
            var resp = await fetch('venues.json');
            venues = await resp.json();
            saveVenuesToLocal(venues);
        } catch(e) {
            venues = [];
        }
    }
    renderVenueList(venues);
}

function renderVenueList(venues) {
    var listEl = document.getElementById('venueMgrList');
    var countEl = document.getElementById('venueCount');
    countEl.textContent = venues.length + ' 个';
    if (!venues || venues.length === 0) {
        listEl.innerHTML = '<div class="venue-mgr-empty">暂无钓场</div>';
        return;
    }
    var html = '';
    venues.forEach(function(v) {
        html += '<div class="venue-mgr-item">' +
            '<div class="info">' +
                '<span class="name">' + escapeHtml(v.name) + '</span>' +
                '<span class="order-id">ID: ' + escapeHtml(v.order_id) + '</span>' +
            '</div>' +
            '<button class="btn-del" onclick="deleteVenue(' + v.id + ')">删除</button>' +
        '</div>';
    });
    listEl.innerHTML = html;
}

async function addVenue() {
    var nameInput = document.getElementById('venueNameInput');
    var orderIdInput = document.getElementById('venueOrderIdInput');
    var name = nameInput.value.trim();
    var order_id = orderIdInput.value.trim();
    if (!name || !order_id) {
        await appAlert('请填写完整的钓场名称和订单 ID');
        return;
    }
    var venues = loadVenuesFromLocal() || [];
    if (venues.some(function(v) { return v.order_id === order_id; })) {
        await appAlert('该订单 ID 已存在，请勿重复添加');
        return;
    }
    var maxId = venues.reduce(function(max, v) { return Math.max(max, v.id || 0); }, 0);
    venues.push({ id: maxId + 1, name: name, order_id: order_id, enabled: true, sort: maxId + 1, remark: '' });
    saveVenuesToLocal(venues);
    nameInput.value = '';
    orderIdInput.value = '';
    renderVenueList(venues);
}

async function deleteVenue(id) {
    var ok = await appConfirm('确定要删除该钓场吗？此操作不可撤销', { danger: true, okText: '删除' });
    if (!ok) return;
    var venues = loadVenuesFromLocal() || [];
    venues = venues.filter(function(v) { return v.id !== id; });
    saveVenuesToLocal(venues);
    renderVenueList(venues);
}

// ============================================================
// 【新增】从订单列表中选择钓场
// ============================================================
var _orderPickerList = [];

async function openOrderPicker() {
    var overlay = document.getElementById('orderPickerOverlay');
    var listEl = document.getElementById('orderPickerList');

    overlay.classList.add('show');
    listEl.innerHTML = '<div class="loading"><div class="spinner"></div>正在加载订单...</div>';

    var token = loadData('token', '');
    var uuid = loadData('uuid', '');
    if (!token || !uuid) {
        listEl.innerHTML = '<div class="empty">请先配置 Token 和 UUID</div>';
        return;
    }
    if (window.AndroidBridge && window.AndroidBridge.setAuth) {
        window.AndroidBridge.setAuth(token, uuid);
    }

    try {
        // 拉取订单列表（page=1, limit=50 够用）
        var result = await callApi('/v2/userApi/order/getMyTicketOrderList?tab=10&page=1&limit=50', 'GET');
        if (result.code !== '000') {
            listEl.innerHTML = '<div class="empty">加载失败: ' + escapeHtml(result.msg || '未知错误') + '</div>';
            return;
        }

        var orders = (result.data && result.data.list) || [];

        // 按 product_id 去重
        var seen = {};
        var uniqueOrders = [];
        orders.forEach(function(o) {
            var pid = o.product_id;
            if (!pid || seen[pid]) return;
            seen[pid] = true;
            uniqueOrders.push(o);
        });

        // 附加钓场名
        uniqueOrders.forEach(function(o) {
            var venueName = '';
            if (o.merchant_model && o.merchant_model.mer_name) {
                venueName = o.merchant_model.mer_name;
            } else if (o.order_ticket_item && o.order_ticket_item.product_info && o.order_ticket_item.product_info.title) {
                venueName = o.order_ticket_item.product_info.title;
            }
            o._venueName = venueName || '未知钓场';
        });

        // 已存在的订单ID集合
        var existingVenues = loadVenuesFromLocal() || [];
        var existingOrderIds = {};
        existingVenues.forEach(function(v) { existingOrderIds[String(v.order_id)] = true; });

        _orderPickerList = uniqueOrders;

        if (uniqueOrders.length === 0) {
            listEl.innerHTML = '<div class="empty">没有找到任何订单</div>';
            return;
        }

        var html = '';
        uniqueOrders.forEach(function(o, idx) {
            var already = existingOrderIds[String(o.order_id)];
            html += '<div class="order-item ' + (already ? 'already' : '') + '" data-idx="' + idx + '">' +
                '<div class="info">' +
                    '<div class="name">' + escapeHtml(o._venueName) + '</div>' +
                    '<div class="meta">订单ID: ' + escapeHtml(o.order_id) + '</div>' +
                '</div>' +
                '<span class="status-tag">' + (already ? '已添加' : '添加') + '</span>' +
            '</div>';
        });
        listEl.innerHTML = html;

        listEl.querySelectorAll('.order-item').forEach(function(el) {
            el.addEventListener('click', function() {
                var idx = parseInt(el.getAttribute('data-idx'), 10);
                if (isNaN(idx)) return;
                pickOrder(idx);
            });
        });

    } catch(e) {
        listEl.innerHTML = '<div class="empty">加载异常: ' + escapeHtml(e.message || '') + '</div>';
    }
}

async function pickOrder(idx) {
    var order = _orderPickerList[idx];
    if (!order) return;

    var venueName = order._venueName;
    var orderId = String(order.order_id);

    var venues = loadVenuesFromLocal() || [];
    if (venues.some(function(v) { return String(v.order_id) === orderId; })) {
        await appAlert('该订单 ID 已存在，无需重复添加');
        return;
    }

    var maxId = venues.reduce(function(max, v) { return Math.max(max, v.id || 0); }, 0);
    venues.push({
        id: maxId + 1,
        name: venueName,
        order_id: orderId,
        enabled: true,
        sort: maxId + 1,
        remark: ''
    });
    saveVenuesToLocal(venues);
    renderVenueList(venues);

    // 刷新弹层，把这条标记为已添加
    await openOrderPicker();
}

function closeOrderPicker() {
    document.getElementById('orderPickerOverlay').classList.remove('show');
}

// 点遮罩关闭
document.getElementById('orderPickerOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeOrderPicker();
});

// ============================================================
// 导出配置
// ============================================================
async function exportConfig() {
    var btn = document.getElementById('btnExport');
    var statusEl = document.getElementById('backupStatus');

    if (!window.AndroidBridge || !window.AndroidBridge.exportConfig) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'AndroidBridge.exportConfig 未注入';
        return;
    }

    btn.disabled = true;
    btn.textContent = '导出中...';
    statusEl.className = 'status-msg info';
    statusEl.textContent = '正在打包配置...';

    try {
        var venuesJson = window.AndroidBridge.loadVenues();
        var seatMapJson = window.AndroidBridge.loadSeatMap();

        var config = {
            _meta: {
                exportTime: new Date().toISOString(),
                version: '1.0'
            },
            venues: JSON.parse(venuesJson || '[]'),
            seatMap: JSON.parse(seatMapJson || '{}')
        };

        var filename = 'fishing-config-' + Date.now() + '.json';
        var content = JSON.stringify(config, null, 2);

        var result = window.AndroidBridge.exportConfig(content, filename);

        if (result && result.indexOf('ERROR') === 0) {
            statusEl.className = 'status-msg error';
            statusEl.textContent = '导出失败: ' + result;
        } else {
            statusEl.className = 'status-msg success';
            statusEl.textContent = '导出成功，文件已保存到: ' + result;
        }
    } catch(e) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '导出异常: ' + e.message;
    } finally {
        btn.disabled = false;
        btn.textContent = '导出配置';
    }
}

// ============================================================
// 导入配置
// ============================================================
var importPending = false;

function importConfig() {
    var statusEl = document.getElementById('backupStatus');
    if (!window.AndroidBridge || !window.AndroidBridge.pickFileForImport) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'AndroidBridge.pickFileForImport 未注入';
        return;
    }
    importPending = true;
    statusEl.className = 'status-msg info';
    statusEl.textContent = '请选择要导入的配置文件...';
    window.AndroidBridge.pickFileForImport();
}

window._onImportFileSelected = async function(content) {
    var statusEl = document.getElementById('backupStatus');
    if (!importPending) return;
    importPending = false;

    if (!content || content === '') {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '未选择文件或文件内容为空';
        return;
    }

    try {
        var config = JSON.parse(content);
        if (!config.venues && !config.seatMap) {
            statusEl.className = 'status-msg error';
            statusEl.textContent = '文件格式不正确（缺少 venues 或 seatMap）';
            return;
        }

        var ok = await appConfirm('将覆盖当前的钓场列表和号码池，确定导入？', { danger: true, okText: '覆盖导入' });
        if (!ok) {
            statusEl.className = 'status-msg info';
            statusEl.textContent = '已取消导入';
            return;
        }

        if (config.venues) {
            var venuesJson = JSON.stringify(config.venues);
            window.AndroidBridge.saveVenues(venuesJson);
            saveData('venues_data', venuesJson);
        }
        if (config.seatMap) {
            var seatMapJson = JSON.stringify(config.seatMap);
            window.AndroidBridge.saveSeatMap(seatMapJson);
        }

        loadVenueList();

        statusEl.className = 'status-msg success';
        statusEl.textContent = '导入成功！钓场: ' + (config.venues ? config.venues.length : 0) + ' 个，号码池已覆盖';
    } catch(e) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '导入失败: ' + e.message;
    }
};

// ============================================================
// 自动生成钓场库
// ============================================================
async function autoGenerateVenues() {
    var btn = document.getElementById('btnAutoVenues');
    var statusEl = document.getElementById('poolStatus');
    var token = loadData('token', '');
    var uuid = loadData('uuid', '');

    if (!token || !uuid) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '请先配置 Token 和 UUID';
        return;
    }
    if (!window.AndroidBridge) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'AndroidBridge 未注入';
        return;
    }
    var confirmed = await appConfirm('将根据历史订单重新生成钓场库，覆盖现有钓场列表，确定继续？', { okText: '继续' });
    if (!confirmed) return;

    if (window.AndroidBridge.setAuth) window.AndroidBridge.setAuth(token, uuid);
    btn.disabled = true;
    btn.textContent = '分析中...';
    statusEl.className = 'status-msg info';
    statusEl.textContent = '正在获取历史订单...';

    try {
        var firstPage = await callApi('/v2/userApi/order/getMyTicketOrderList?tab=10&page=1&limit=10', 'GET');
        if (firstPage.code !== '000') {
            throw new Error(firstPage.msg || '获取订单失败');
        }

        var totalCount = firstPage.data.count || 0;
        var totalPages = Math.ceil(totalCount / 10);
        if (totalPages === 0) totalPages = 1;

        statusEl.textContent = '共 ' + totalCount + ' 个订单，正在分析...';

        var venueMap = {};

        for (var page = 1; page <= totalPages; page++) {
            var pageResult;
            if (page === 1) {
                pageResult = firstPage;
            } else {
                pageResult = await callApi('/v2/userApi/order/getMyTicketOrderList?tab=10&page=' + page + '&limit=10', 'GET');
                if (pageResult.code !== '000') continue;
            }

            var orders = pageResult.data.list || [];
            for (var i = 0; i < orders.length; i++) {
                var order = orders[i];
                var productId = order.product_id;
                var orderId = order.order_id;
                if (!productId) continue;
                if (venueMap[productId]) continue;

                var venueName = null;
                if (order.merchant_model && order.merchant_model.mer_name) {
                    venueName = order.merchant_model.mer_name;
                } else if (order.order_ticket_item && order.order_ticket_item.product_info && order.order_ticket_item.product_info.title) {
                    venueName = order.order_ticket_item.product_info.title;
                }

                if (venueName) {
                    venueMap[productId] = {
                        name: venueName,
                        order_id: orderId
                    };
                }
            }

            statusEl.textContent = '分析中... ' + page + '/' + totalPages;
            await new Promise(function(r) { setTimeout(r, 200); });
        }

        var venues = [];
        var id = 1;
        for (var pid in venueMap) {
            venues.push({
                id: id++,
                name: venueMap[pid].name,
                order_id: venueMap[pid].order_id,
                enabled: true,
                sort: id,
                remark: ''
            });
        }

        if (venues.length === 0) {
            statusEl.className = 'status-msg error';
            statusEl.textContent = '没有找到任何钓场信息';
            return;
        }

        saveVenuesToLocal(venues);
        statusEl.className = 'status-msg success';
        statusEl.textContent = '已生成 ' + venues.length + ' 个钓场，正在刷新号码池...';

        renderVenueList(venues);

        await refreshSeatMap();

    } catch(e) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '生成失败: ' + e.message;
    } finally {
        btn.disabled = false;
        btn.textContent = '自动生成钓场库';
    }
}

// ============================================================
// 刷新号码池
// ============================================================
async function refreshSeatMap() {
    var btn = document.getElementById('btnRefreshPool');
    var statusEl = document.getElementById('poolStatus');
    var token = loadData('token', '');
    var uuid = loadData('uuid', '');
    if (!token || !uuid) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '请先配置 Token 和 UUID';
        return;
    }
    if (!window.AndroidBridge) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'AndroidBridge 未注入';
        return;
    }
    if (window.AndroidBridge.setAuth) window.AndroidBridge.setAuth(token, uuid);
    btn.disabled = true;
    btn.textContent = '刷新中...';
    statusEl.className = 'status-msg info';
    statusEl.textContent = '正在刷新号码池...';
    try {
        var venues = loadVenuesFromLocal() || [];
        if (venues.length === 0) {
            statusEl.className = 'status-msg error';
            statusEl.textContent = '钓场列表为空';
            btn.disabled = false;
            btn.textContent = '刷新号码池';
            return;
        }
        var seatMap = {};
        var totalSeats = 0;
        var totalVenues = 0;
        var failedVenues = [];
        for (var i = 0; i < venues.length; i++) {
            var venue = venues[i];
            try {
                var result = await callApi('/v2/userApi/ticketSeat/querySeatList?order_id=' + venue.order_id, 'GET');
                if (result.code === '000' && result.data && result.data.seat_list) {
                    var map = {};
                    result.data.seat_list.forEach(function(seat) {
                        map[seat.seat_number] = seat.product_ticket_seat_id;
                    });
                    seatMap[venue.name] = map;
                    totalSeats += result.data.seat_list.length;
                    totalVenues++;
                } else {
                    failedVenues.push(venue.name);
                }
            } catch(e) {
                failedVenues.push(venue.name);
            }
            await new Promise(function(r) { setTimeout(r, 500); });
        }
        var seatMapJson = JSON.stringify(seatMap);
        if (window.AndroidBridge && window.AndroidBridge.saveSeatMap) {
            window.AndroidBridge.saveSeatMap(seatMapJson);
        }
        saveData('seat_map_data', seatMapJson);
        statusEl.className = 'status-msg success';
        statusEl.textContent = '号码池已刷新: ' + totalSeats + ' 个座位, ' + totalVenues + ' 个钓场' + (failedVenues.length > 0 ? ', 跳过: ' + failedVenues.join('、') : '');
    } catch(e) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '刷新失败: ' + e.message;
    } finally {
        btn.disabled = false;
        btn.textContent = '刷新号码池';
    }
}
