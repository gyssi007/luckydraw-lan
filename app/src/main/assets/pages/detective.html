<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>钓场侦探 - 渔榜助手</title>
    <link rel="stylesheet" href="../assets/css/app.css">
    <style>
        .detective-container{background:transparent;padding:0}
        .header{background:linear-gradient(135deg,#0a2f44,#1a5f7a);border-radius:16px;padding:14px 18px;margin-bottom:14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(10,47,68,0.25)}
        .header h1{color:#fff;font-size:17px;font-weight:700}
        .header-controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;justify-content:flex-end}
        .btn-refresh{background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:16px;cursor:pointer;min-height:42px;display:flex;align-items:center;justify-content:center;outline:none!important}
        .btn-refresh:active{background:rgba(255,255,255,0.25)}
        .btn-refresh:disabled{opacity:0.4;cursor:not-allowed}
        .venue-selector-trigger{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,0.05);cursor:pointer;touch-action:manipulation;min-height:52px}
        .venue-selector-trigger .selected-placeholder{color:#0a2f44;font-weight:600;font-size:15px}
        .venue-selector-trigger .arrow{color:#94a3b8;font-size:14px}
        .venue-selector-trigger:active{background:#f1f5f9}
        .venue-selector-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(8,15,25,0.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:2000;justify-content:center;align-items:flex-end;padding:0}
        .venue-selector-overlay.show{display:flex}
        .venue-selector-modal{background:#fff;border-radius:26px 26px 0 0;padding:8px 20px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;width:100%;max-height:78vh;display:flex;flex-direction:column;box-shadow:0 -14px 40px rgba(0,0,0,0.25);transform:translateY(100%);animation:none;transition:transform .32s cubic-bezier(.32,.72,0,1);touch-action:none}
        .venue-selector-overlay.show .venue-selector-modal{transform:translateY(0)}
        .venue-selector-modal .sheet-handle{width:38px;height:5px;border-radius:3px;background:#e2e8f0;margin:6px auto 14px;flex-shrink:0}
        .venue-selector-modal .modal-title{font-size:16px;font-weight:700;color:#0a2f44;padding-bottom:14px;border-bottom:1px solid #eef2f6;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
        .venue-selector-modal .modal-title .close-btn{cursor:pointer;font-size:18px;color:#94a3b8;background:#f1f5f9;border:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;outline:none!important}
        .venue-selector-modal .venue-list{overflow-y:auto;flex:1;padding-top:10px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
        .venue-selector-modal .venue-item{padding:14px 16px;border-radius:14px;cursor:pointer;transition:background .15s,transform .1s;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;outline:none!important}
        .venue-selector-modal .venue-item:active{background:#eef2f6;transform:scale(.98)}
        .venue-selector-modal .venue-item .name{font-weight:500;color:#0a2f44;font-size:14.5px}
        .venue-selector-modal .venue-item .check{color:#22c55e;font-size:18px;display:none}
        .venue-selector-modal .venue-item.active .check{display:block}
        .venue-selector-modal .venue-item.active{background:#eef6ff}
        .venue-selector-modal .venue-empty{padding:30px 20px;text-align:center;color:#94a3b8;font-size:13px}

        /* ===== 原生 App 风格弹窗（替代系统 alert） ===== */
        .app-dialog-mask{position:fixed;inset:0;background:rgba(8,15,25,0.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:3000;display:flex;align-items:center;justify-content:center;padding:30px;opacity:0;transition:opacity .2s ease}
        .app-dialog-mask.show{opacity:1}
        .app-dialog-card{background:#fff;border-radius:26px;width:100%;max-width:340px;padding:30px 24px 20px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,0.35);transform:translateY(24px) scale(.92);opacity:0;transition:transform .32s cubic-bezier(.34,1.56,.64,1),opacity .25s ease}
        .app-dialog-mask.show .app-dialog-card{transform:translateY(0) scale(1);opacity:1}
        .app-dialog-icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
        .app-dialog-title{font-size:17px;font-weight:700;color:#0a2f44;margin-bottom:8px}
        .app-dialog-msg{font-size:13.5px;color:#67798c;line-height:1.65;margin-bottom:22px;white-space:pre-line;word-break:break-word}
        .app-dialog-btns{display:flex;gap:10px}
        .app-dialog-btn{flex:1;border:none;border-radius:14px;padding:13px 10px;font-size:14.5px;font-weight:700;cursor:pointer;min-height:46px;transition:transform .12s}
        .app-dialog-btn:active{transform:scale(.94)}
        .app-dialog-btn.primary{background:#3b82f6;color:#fff}
        .app-dialog-btn.danger{background:#ef4444;color:#fff}
        .app-dialog-btn.secondary{background:#eef2f6;color:#334455}
        .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
        .stat-card{background:#fff;border-radius:14px;padding:14px 12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
        .stat-card .number{font-size:26px;font-weight:700;line-height:1.2}
        .stat-card .label{font-size:12px;color:#6b8ba0;margin-top:2px}
        .stat-card.total .number{color:#0a2f44}
        .stat-card.green .number{color:#2b9c5c}
        .stat-card.orange .number{color:#e68a2e}
        .stat-card.blue .number{color:#2a7de1}
        .stat-card.red .number{color:#d14545}
        .venue-banner{background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
        .venue-banner .info{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
        .venue-banner .info .label{color:#6b8ba0;font-size:11px}
        .venue-banner .info .value{font-weight:600;color:#0a2f44;font-size:14px}
        .venue-banner .update-time{color:#6b8ba0;font-size:11px;white-space:nowrap}
        .legend{display:flex;flex-wrap:wrap;gap:12px 18px;background:#fff;padding:10px 16px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.05);overflow-x:auto}
        .legend-item{display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;color:#1d3b4b;white-space:nowrap}
        .dot{width:14px;height:14px;border-radius:4px;flex-shrink:0}
        .dot.green{background:#2b9c5c}
        .dot.blue{background:#2a7de1}
        .dot.orange{background:#e68a2e}
        .dot.red{background:#d14545}
        .seat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(75px,1fr));gap:10px;background:#fff;padding:14px;border-radius:14px;min-height:120px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
        /* ===== 钓位卡片 —— 颜色更显眼 ===== */
        .seat-card{
            border-radius:12px;
            padding:8px 4px 6px;
            text-align:center;
            transition: transform .1s, box-shadow .1s;
            position: relative;
            border: 1px solid rgba(0,0,0,0.02);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70px;
        }
        .seat-card:active{ transform: scale(0.96); }
        .seat-card .number{
            font-weight:800;
            font-size:19px;
            line-height:1.2;
            letter-spacing:-0.5px;
            text-shadow: 0 1px 1px rgba(0,0,0,0.05);
        }
        .seat-card .status-label{
            font-size:10px;
            font-weight:700;
            margin-top:2px;
            line-height:1.2;
            text-transform: uppercase;
            letter-spacing:0.3px;
            opacity:0.9;
        }
        /* 空闲 —— 翠绿色底 + 深绿字 + 白色小圆点装饰 */
        .seat-card.status-10{
            background: #d4f0e0;
            border: 1px solid #2b9c5c;
            border-left: 6px solid #2b9c5c;
            color: #0a3d2a;
        }
        .seat-card.status-10 .number{ color: #0a4d2e; }
        .seat-card.status-10 .status-label{ color: #1a6b3c; }

        /* 准备中 —— 明亮橙黄底 + 深橙字 + 左侧粗边 */
        .seat-card.status-20{
            background: #fff0d6;
            border: 1px solid #e68a2e;
            border-left: 6px solid #e68a2e;
            color: #6b3e0a;
        }
        .seat-card.status-20 .number{ color: #8a4e0a; }
        .seat-card.status-20 .status-label{ color: #b45f1a; }

        /* 垂钓中 —— 清亮蓝底 + 深蓝字 + 左侧粗边 */
        .seat-card.status-40{
            background: #d9e9ff;
            border: 1px solid #2a7de1;
            border-left: 6px solid #2a7de1;
            color: #0a2f5a;
        }
        .seat-card.status-40 .number{ color: #0a3d7a; }
        .seat-card.status-40 .status-label{ color: #1a5aa8; }

        /* 锁号 —— 醒目红底 + 深红字 + 左侧粗边 + 斜纹纹理增加警示感 */
        .seat-card.status-50{
            background: #ffe1e1;
            border: 1px solid #d14545;
            border-left: 6px solid #d14545;
            color: #5a0a0a;
            background-image: repeating-linear-gradient(45deg, rgba(209,69,69,0.08) 0px, rgba(209,69,69,0.08) 6px, transparent 6px, transparent 12px);
        }
        .seat-card.status-50 .number{ color: #8a1a1a; }
        .seat-card.status-50 .status-label{ color: #b52a2a; }

        /* 未知状态 —— 灰色 */
        .seat-card.status-0{
            background: #f0f3f7;
            border: 1px solid #b0c0d0;
            border-left: 6px solid #b0c0d0;
            color: #3a4a5a;
        }
        .seat-card.status-0 .number{ color: #3a4a5a; }
        .seat-card.status-0 .status-label{ color: #5a6a7a; }

        /* 统一状态标签字重 */
        .seat-card .status-label{
            font-weight: 800;
            font-size: 10px;
            margin-top: 2px;
        }

        /* 增加图标点缀 (伪元素) */
        .seat-card.status-10::after{
            content: "🟢";
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 9px;
            opacity: 0.7;
        }
        .seat-card.status-20::after{
            content: "🟠";
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 9px;
            opacity: 0.7;
        }
        .seat-card.status-40::after{
            content: "🔵";
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 9px;
            opacity: 0.7;
        }
        .seat-card.status-50::after{
            content: "🔴";
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 9px;
            opacity: 0.8;
        }

        .loading-mask{display:flex;justify-content:center;align-items:center;min-height:120px;color:#6b8ba0;font-size:14px;gap:10px;grid-column:1/-1}
        .spinner{width:28px;height:28px;border:3px solid #e0e8f0;border-top-color:#2a7de1;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
        @keyframes spin{to{transform:rotate(360deg)}}
        .empty-state{text-align:center;padding:30px 16px;color:#6b8ba0;grid-column:1/-1}
        .empty-state .icon{font-size:36px;margin-bottom:6px}
        .error-state{text-align:center;padding:30px 16px;grid-column:1/-1}
        .error-state .icon{font-size:36px;margin-bottom:6px}
        .error-state .title{font-weight:600;color:#d14545;font-size:15px}
        .error-state .desc{color:#6b8ba0;font-size:13px;margin-top:4px}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#ffffff;border-top:1px solid #e8edf4;display:flex;justify-content:space-around;align-items:center;height:64px;z-index:999;box-shadow:0 -2px 12px rgba(0,0,0,0.06)}
        .bottom-nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0;cursor:pointer;touch-action:manipulation;border:none;background:transparent;color:#94a3b8;font-size:11px;font-weight:500;transition:color .2s;position:relative;outline:none!important;text-decoration:none}
        .bottom-nav .tab .tab-icon{font-size:20px;line-height:1.2;color:#94a3b8;transition:color .2s}
        .bottom-nav .tab .tab-label{color:#94a3b8;transition:color .2s}
        .bottom-nav .tab.active .tab-icon{color:#0a2f44}
        .bottom-nav .tab.active .tab-label{color:#0a2f44;font-weight:600}
        .bottom-nav .tab.active::after{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;background:#0a2f44;border-radius:0 0 3px 3px}
        .bottom-nav .tab:active{transform:scale(0.92)}
        @media(max-width:400px){
            .header{padding:12px 14px}
            .header h1{font-size:15px}
            .seat-grid{grid-template-columns:repeat(auto-fill,minmax(65px,1fr));padding:10px;gap:6px}
            .seat-card .number{font-size:16px}
            .seat-card .status-label{font-size:8px}
            .stats{gap:6px}
            .stat-card{padding:10px 8px}
            .stat-card .number{font-size:22px}
        }
        @media(min-width:600px){
            .stats{grid-template-columns:repeat(4,1fr);gap:14px}
            .stat-card .number{font-size:30px}
            .seat-grid{grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:12px;padding:18px}
            .seat-card .number{font-size:21px}
            .seat-card .status-label{font-size:11px}
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="page active" id="pageDetective">
        <div class="detective-container">
            <div class="header">
                <h1>真相永远只有一个!</h1>
                <div class="header-controls">
                    <button class="btn-refresh" id="refreshBtn" onclick="fetchVenueData()">🔄 刷新</button>
                </div>
            </div>

            <div class="venue-selector-trigger" id="venueTrigger">
                <span class="selected-placeholder" id="selectedVenueDisplay">请选择钓场</span>
                <span class="arrow">▼</span>
            </div>

            <div class="venue-selector-overlay" id="venueOverlay">
                <div class="venue-selector-modal" id="venueSheet">
                    <div class="sheet-handle" id="sheetHandle"></div>
                    <div class="modal-title">
                        <span>选择钓场</span>
                        <button class="close-btn" onclick="closeVenueSelector()">✕</button>
                    </div>
                    <div class="venue-list" id="venueList">
                        <div class="venue-empty">加载中...</div>
                    </div>
                </div>
            </div>

            <div class="stats">
                <div class="stat-card total"><div class="number" id="totalSeats">-</div><div class="label">总钓位</div></div>
                <div class="stat-card green"><div class="number" id="freeCount">-</div><div class="label">🟢 空闲</div></div>
                <div class="stat-card orange"><div class="number" id="preparingCount">-</div><div class="label">🟠 准备中</div></div>
                <div class="stat-card blue"><div class="number" id="usedCount">-</div><div class="label">🔵 垂钓中</div></div>

            </div>

</div>

        <span class="tab-icon">⚙️</span>

<script src="../assets/common.js"></script>
<script>
// ============================================================
// 📱 原生 App 风格弹窗（appAlert 替代系统 alert）
// ============================================================
function appDialog(opts) {
    return new Promise(function(resolve) {
        var mask = document.createElement('div');
        mask.className = 'app-dialog-mask';
        var btnsHtml = '';
        opts.buttons.forEach(function(b, i) {
            btnsHtml += '<button class="app-dialog-btn ' + (b.type || 'secondary') + '" data-i="' + i + '">' + b.text + '</button>';
        });
        mask.innerHTML =
            '<div class="app-dialog-card">' +
                '<div class="app-dialog-icon" style="background:' + (opts.iconBg || '#e3edf7') + '">' + (opts.icon || '💬') + '</div>' +
                '<div class="app-dialog-title">' + opts.title + '</div>' +
                '<div class="app-dialog-msg">' + opts.message + '</div>' +
                '<div class="app-dialog-btns">' + btnsHtml + '</div>' +
            '</div>';
        document.body.appendChild(mask);
        requestAnimationFrame(function() { mask.classList.add('show'); });

        function close(val) {
            mask.classList.remove('show');
            setTimeout(function() { mask.remove(); }, 220);
            resolve(val);
        }
        mask.querySelectorAll('.app-dialog-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var idx = parseInt(btn.getAttribute('data-i'), 10);
                close(opts.buttons[idx].value);
            });
        });
    });
}

function appAlert(message, opts) {
    opts = opts || {};
    return appDialog({
        icon: opts.icon || '💡',
        iconBg: opts.iconBg || '#e3edf7',
        title: opts.title || '提示',
        message: message,
        buttons: [{ text: opts.okText || '知道了', type: 'primary', value: true }]
    });
}

var VENUES = [];
var SELECTED_VENUE_ID = null;
var STATUS_MAP = {
    10: { label: '空闲', css: 'status-10' },
    20: { label: '准备中', css: 'status-20' },
    40: { label: '垂钓中', css: 'status-40' },
    50: { label: '锁号', css: 'status-50' }
};

var venueTrigger = document.getElementById('venueTrigger');
var venueOverlay = document.getElementById('venueOverlay');
var venueList = document.getElementById('venueList');
var selectedVenueDisplay = document.getElementById('selectedVenueDisplay');
var seatGrid = document.getElementById('seatGrid');
var totalSeats = document.getElementById('totalSeats');
var freeCount = document.getElementById('freeCount');
var preparingCount = document.getElementById('preparingCount');
var usedCount = document.getElementById('usedCount');
var lockedCount = document.getElementById('lockedCount');
var venueName = document.getElementById('venueName');
var venueStatus = document.getElementById('venueStatus');
var updateTime = document.getElementById('updateTime');

// ============================================================
// 📋 从本地读取钓场列表
// ============================================================
function loadVenuesFromLocal() {
    try {
        if (window.AndroidBridge && window.AndroidBridge.loadVenues) {
            var json = window.AndroidBridge.loadVenues();
            if (json && json !== '[]') return JSON.parse(json);
        }
        var stored = loadData('venues_data', '');
        if (stored) return JSON.parse(stored);
    } catch(e) {
        console.error('加载钓场失败:', e);
    }
    return null;
}

function openVenueSelector() {
    venueOverlay.classList.add('show');
    renderVenueList2();
}

function closeVenueSelector() {
    venueOverlay.classList.remove('show');
}

function renderVenueList2() {
    if (!VENUES || VENUES.length === 0) {
        venueList.innerHTML = '<div class="venue-empty">暂无钓场数据</div>';
        return;
    }
    var html = '';
    VENUES.forEach(function(v) {
        var active = v.order_id === SELECTED_VENUE_ID ? 'active' : '';
        html += '<div class="venue-item ' + active + '" data-id="' + v.order_id + '" onclick="selectVenue2(\'' + v.order_id + '\')">' +
            '<span class="name">' + v.name + '</span>' +
            '<span class="check">✓</span>' +
        '</div>';
    });
    venueList.innerHTML = html;
}

function selectVenue2(orderId) {
    SELECTED_VENUE_ID = orderId;
    saveData('detective_selected_venue', orderId);
    var venue = null;
    for (var i = 0; i < VENUES.length; i++) {
        if (VENUES[i].order_id === orderId) {
            venue = VENUES[i];
            break;
        }
    }
    selectedVenueDisplay.textContent = venue ? venue.name : '已选择';
    selectedVenueDisplay.className = 'selected-name';
    closeVenueSelector();
    fetchVenueData();
}

venueTrigger.addEventListener('click', openVenueSelector);
venueOverlay.addEventListener('click', function(e) {
    if (e.target === this) closeVenueSelector();
});

// ============================================================
// 👆 底部弹层下拉手势关闭（仅视觉/交互增强，不影响业务逻辑）
// ============================================================
(function enableSheetDragToClose() {
    var sheet = document.getElementById('venueSheet');
    var handle = document.getElementById('sheetHandle');
    var startY = 0, currentY = 0, dragging = false;

    function onStart(e) {
        dragging = true;
        startY = (e.touches ? e.touches[0].clientY : e.clientY);
        sheet.style.transition = 'none';
    }
    function onMove(e) {
        if (!dragging) return;
        currentY = (e.touches ? e.touches[0].clientY : e.clientY) - startY;
        if (currentY < 0) currentY = 0;
        sheet.style.transform = 'translateY(' + currentY + 'px)';
    }
    function onEnd() {
        if (!dragging) return;
        dragging = false;
        sheet.style.transition = '';
        sheet.style.transform = '';
        if (currentY > 90) closeVenueSelector();
        currentY = 0;
    }
    handle.addEventListener('touchstart', onStart, { passive: true });
    handle.addEventListener('touchmove', onMove, { passive: true });
    handle.addEventListener('touchend', onEnd);
    handle.addEventListener('mousedown', onStart);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
})();

// ============================================================
// 📋 加载钓场列表（本地）
// ============================================================
async function loadVenues2() {
    var venues = loadVenuesFromLocal();

    // 如果本地没有，从 assets/pages/venues.json 加载
    if (venues === null) {
        try {
            var resp = await fetch('venues.json');
            venues = await resp.json();
            var json = JSON.stringify(venues);
            if (window.AndroidBridge && window.AndroidBridge.saveVenues) {
                window.AndroidBridge.saveVenues(json);
            }
            saveData('venues_data', json);
        } catch(e) {
            venues = [];
        }
    }

    VENUES = venues;

    if (VENUES.length > 0) {
        // 优先从缓存读取用户上次选择的钓场
        var savedVenueId = loadData('detective_selected_venue', '');
        var found = false;
        if (savedVenueId) {
            for (var i = 0; i < VENUES.length; i++) {
                if (VENUES[i].order_id === savedVenueId) {
                    found = true;
                    break;
                }
            }
        }
        SELECTED_VENUE_ID = found ? savedVenueId : VENUES[0].order_id;

        var selectedVenue = null;
        for (var j = 0; j < VENUES.length; j++) {
            if (VENUES[j].order_id === SELECTED_VENUE_ID) {
                selectedVenue = VENUES[j];
                break;
            }
        }
        selectedVenueDisplay.textContent = selectedVenue ? selectedVenue.name : VENUES[0].name;
        selectedVenueDisplay.className = 'selected-name';
        fetchVenueData();
    } else {
        selectedVenueDisplay.textContent = '请先到配置页添加钓场';
    }
}

// ============================================================
// 🎣 获取钓位数据（本地直连官方 API）
// ============================================================
async function fetchVenueData() {
    var refreshBtn = document.getElementById('refreshBtn');
    refreshBtn.disabled = true;
    refreshBtn.textContent = '⏳';

    var token = loadData('token', '');
    var uuid = loadData('uuid', '');
    if (window.AndroidBridge && window.AndroidBridge.setAuth) {
        window.AndroidBridge.setAuth(token, uuid);
    }

    // 重新加载本地钓场列表（防止配置页添加后不更新）
    var venues = loadVenuesFromLocal();
    if (venues && venues.length > 0) {
        VENUES = venues;
        renderVenueList2();
        // 如果当前选中的钓场已被删除，切换到第一个
        var stillExists = false;
        for (var i = 0; i < VENUES.length; i++) {
            if (VENUES[i].order_id === SELECTED_VENUE_ID) {
                stillExists = true;
                break;
            }
        }
        if (!stillExists && VENUES.length > 0) {
            SELECTED_VENUE_ID = VENUES[0].order_id;
            saveData('detective_selected_venue', SELECTED_VENUE_ID);
            selectedVenueDisplay.textContent = VENUES[0].name;
            selectedVenueDisplay.className = 'selected-name';
        }
    }

    var orderId = SELECTED_VENUE_ID;
    if (!orderId) {
        seatGrid.innerHTML = '<div class="empty-state"><div class="icon"></div><p>请选择钓场查看实时状态</p></div>';
        resetDetectiveStats();
        venueName.textContent = '未选择';
        venueStatus.textContent = '-';
        updateTime.textContent = '等待选择...';
        refreshBtn.disabled = false;
        refreshBtn.textContent = '🔄 刷新';
        return;
    }

    seatGrid.innerHTML = '<div class="loading-mask"><div class="spinner"></div>加载中...</div>';

    try {
        var result = await callApi('/v2/userApi/ticketSeat/querySeatList?order_id=' + orderId, 'GET');

        if (result.code !== '000') {
            throw new Error(result.msg || '接口返回错误');
        }

        var seatList = result.data && result.data.seat_list ? result.data.seat_list : [];
        var venue = null;
        for (var i = 0; i < VENUES.length; i++) {
            if (VENUES[i].order_id === orderId) {
                venue = VENUES[i];
                break;
            }
        }
        renderSeats2(seatList);
        updateDetectiveStats2(seatList);
        updateVenueInfo2(venue ? venue.name : '未知钓场', result);
    } catch(error) {
        console.error('加载失败:', error);
        var errMsg = error.message || '请求失败';
        if (errMsg.indexOf('401') !== -1 || errMsg.indexOf('Token') !== -1) {
            seatGrid.innerHTML = '<div class="error-state"><div class="icon">🔑</div><div class="title">认证失败</div><div class="desc">请到"配置"页面更新 Token</div></div>';
        } else {
            seatGrid.innerHTML = '<div class="error-state"><div class="icon">⚠️</div><div class="title">加载失败</div><div class="desc">' + errMsg + '</div></div>';
        }
        resetDetectiveStats();
    } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = '🔄 刷新';
    }
}

function renderSeats2(seatList) {
    if (!Array.isArray(seatList) || seatList.length === 0) {
        seatGrid.innerHTML = '<div class="empty-state"><div class="icon">🏝️</div><p>暂无钓位数据</p></div>';
        return;
    }
    var sorted = seatList.slice().sort(function(a,b) { return (parseInt(a.seat_number)||0) - (parseInt(b.seat_number)||0); });
    var html = '';
    sorted.forEach(function(seat) {
        var status = seat.status || 0;
        var statusInfo = STATUS_MAP[status] || { label: '未知', css: 'status-0' };
        var seatNum = seat.seat_number || '?';
        html += '<div class="seat-card ' + statusInfo.css + '"><div class="number">' + seatNum + '</div><div class="status-label">' + statusInfo.label + '</div></div>';
    });
    seatGrid.innerHTML = html;
}

function updateDetectiveStats2(seatList) {
    if (!Array.isArray(seatList)) { resetDetectiveStats(); return; }
    var free = 0, preparing = 0, used = 0, locked = 0;
    seatList.forEach(function(s) {
        var status = s.status || 0;
        if (status === 10) free++;
        else if (status === 20) preparing++;
        else if (status === 40) used++;
        else if (status === 50) locked++;
    });
    totalSeats.textContent = seatList.length;
    freeCount.textContent = free;
    preparingCount.textContent = preparing;
    usedCount.textContent = used;
    lockedCount.textContent = locked;
}

function resetDetectiveStats() {
    totalSeats.textContent = '-';
    freeCount.textContent = '-';
    preparingCount.textContent = '-';
    usedCount.textContent = '-';
    lockedCount.textContent = '-';
}

function updateVenueInfo2(name, data) {
    venueName.textContent = name || '未知';
    var statusCode = (data && data.data && data.data.status) ? data.data.status : (data ? data.status : undefined);
    var statusText = '-';
    if (statusCode === 70) statusText = '✅ 营业中';
    else if (statusCode) statusText = '状态 ' + statusCode;
    venueStatus.textContent = statusText;
    var now = new Date();
    var timeStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
    updateTime.textContent = '🕒 ' + timeStr;
}

// ============================================================
// 🚀 初始化
// ============================================================
(function initDetectivePage() {
    var token = loadData('token', '');
    var uuid = loadData('uuid', '');
    if (window.AndroidBridge && window.AndroidBridge.setAuth) {
        window.AndroidBridge.setAuth(token, uuid);
    }

    // 未配置 Token/UUID，直接加载本地钓场列表
    if (!token || !uuid) {
        console.warn('未配置 Token 或 UUID');
        loadVenues2();
        return;
    }

    // 启动时检查 Token 有效性
    checkTokenValidity().then(function(res) {
        if (!res.valid) {
            console.error('Token 无效:', res.reason);
            // 弹窗提示用户
            appAlert('Token 已过期，请到配置页面重新设置', { icon: '🔑', iconBg: '#fde8e8', title: '登录已失效' });
            setTimeout(function() {
                navigateTo('config.html');
            }, 1500);
            return;
        }
        // Token 有效，正常加载
        loadVenues2();
    });
})();

</script>
