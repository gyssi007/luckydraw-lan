name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''          # 关键：留空，跳过安装已废弃的 tools 包
          # 如果构建时提示缺少 platform 或 build-tools，可以按需补上，例如：
          # packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      # ==========新增：重命名APK==========
      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AutoTaskSystem.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 自动刷号系统
          path: app/build/outputs/apk/debug/AutoTaskSystem.apk
