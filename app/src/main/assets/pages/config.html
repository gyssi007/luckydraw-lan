<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>配置 - 渔榜助手</title>
    <style>
        body { background: #f0f4f8; min-height: 100vh; padding: 0 0 100px 0; display: flex; justify-content: center; align-items: flex-start; }
        .app-container { max-width: 800px; width: 100%; padding: 12px; padding-bottom: 100px; }
        .page { display: block; }
        .config-container { background: #fff; border-radius: 16px; padding: 24px 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .config-container .page-title { font-size: 20px; font-weight: 700; color: #0a2f44; margin-bottom: 4px; }
        .config-container .page-subtitle { color: #8899aa; font-size: 13px; margin-bottom: 20px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #334455; margin-bottom: 4px; }
        .field .input-row { display: flex; gap: 6px; }
        .field .input-row textarea,
        .field .input-row input { flex: 1; padding: 10px 12px; border: 1px solid #dce4ec; border-radius: 10px; font-size: 13px; font-family: monospace; background: #f8fafc; min-height: 42px; resize: vertical; outline: none; }
        .field .hint { font-size: 11px; color: #8899aa; margin-top: 4px; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .actions button { padding: 10px 16px; border-radius: 10px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; flex: 1; min-width: 70px; min-height: 44px; }
        .actions .btn-save { background: #3b82f6; color: #fff; }
        .actions .btn-test { background: #22c55e; color: #fff; }
        .status-msg { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; }
        .status-msg.success { display: block; background: #e6f7ed; color: #1a7a44; }
        .status-msg.error { display: block; background: #fde8e8; color: #b33a3a; }
        .status-msg.info { display: block; background: #e3edf7; color: #1a5f7a; }
        .pool-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 6px; padding: 12px 14px; background: #f8fafc; border-radius: 10px; border: 1px solid #e8edf4; align-items: center; }
        .pool-actions .btn-refresh-pool { background: #f59e0b; color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 600; font-size: 13px; cursor: pointer; min-height: 44px; flex: 1; }
        .pool-actions .btn-refresh-pool:disabled { opacity: 0.5; cursor: not-allowed; }
        .pool-actions .pool-hint { color: #8899aa; font-size: 11px; flex: 1; min-width: 120px; }
        .pool-status { margin-top: 8px; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; }
        .pool-status.success { display: block; background: #e6f7ed; color: #1a7a44; }
        .pool-status.error { display: block; background: #fde8e8; color: #b33a3a; }
        .pool-status.info { display: block; background: #e3edf7; color: #1a5f7a; }
        .venue-mgr-section { margin-top: 18px; border-top: 1px solid #e8edf4; padding-top: 16px; }
        .venue-mgr-section .section-title { font-size: 15px; font-weight: 700; color: #0a2f44; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .venue-mgr-section .section-title .count-badge { background: #e8edf4; color: #334455; font-size: 12px; padding: 2px 10px; border-radius: 12px; }
        .venue-dropdown-wrapper { margin-top: 12px; border: 1px solid #e8edf4; border-radius: 10px; overflow: hidden; background: #f8fafc; }
        .venue-dropdown-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; cursor: pointer; background: #ffffff; }
        .venue-dropdown-header .title { font-weight: 600; color: #0a2f44; font-size: 14px; }
        .venue-dropdown-header .arrow { color: #94a3b8; font-size: 14px; }
        .venue-dropdown-header .arrow.open { transform: rotate(180deg); }
        .venue-dropdown-body { max-height: 0; overflow: hidden; transition: max-height .3s ease; padding: 0 16px; background: #ffffff; }
        .venue-dropdown-body.open { padding: 12px 16px 16px 16px; }
        .venue-mgr-add { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .venue-mgr-add input { width: 100%; padding: 10px 12px; border: 1px solid #dce4ec; border-radius: 10px; font-size: 13px; background: #f8fafc; min-height: 44px; }
        .venue-mgr-add .btn-add { align-self: flex-end; background: #22c55e; color: #fff; border: none; border-radius: 10px; padding: 8px 20px; font-weight: 600; font-size: 13px; cursor: pointer; min-height: 44px; }
        .venue-mgr-list { display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow-y: auto; }
        .venue-mgr-item { background: #f8fafc; border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
        .venue-mgr-item .info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
        .venue-mgr-item .info .name { font-weight: 600; color: #0a2f44; font-size: 14px; }
        .venue-mgr-item .info .order-id { color: #8899aa; font-size: 11px; font-family: monospace; }
        .venue-mgr-item .btn-del { background: #ef4444; color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; min-height: 36px; }
        .venue-mgr-empty, .venue-mgr-loading { text-align: center; padding: 20px; color: #8899aa; font-size: 13px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid #e8edf4; display: flex; justify-content: space-around; align-items: center; height: 64px; z-index: 999; }
        .bottom-nav .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 0; color: #94a3b8; font-size: 11px; font-weight: 500; text-decoration: none; position: relative; }
        .bottom-nav .tab .tab-icon { font-size: 20px; line-height: 1.2; }
        .bottom-nav .tab.active .tab-icon, .bottom-nav .tab.active .tab-label { color: #0a2f44; }
        .bottom-nav .tab.active .tab-label { font-weight: 600; }
        .bottom-nav .tab.active::after { content: ''; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; background: #0a2f44; border-radius: 0 0 3px 3px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent !important; outline: none !important; }
        button { outline: none !important; border: none !important; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="page active" id="pageConfig">
        <div class="config-container">
            <div class="page-title">⚙️ 代理配置</div>
            <div class="page-subtitle">配置 Token 和 UUID（已加密存储）</div>

            <div class="field">
                <label>Token</label>
                <div class="input-row">
                    <textarea id="tokenInput" placeholder="Bearer ..."></textarea>
                </div>
                <div class="hint">复制 Authorization 头的完整值</div>
            </div>

            <div class="field">
                <label>UUID</label>
                <div class="input-row">
                    <input id="uuidInput" placeholder="1776084841949" />
                </div>
                <div class="hint">复制 uuid 头的值</div>
            </div>

            <div class="actions">
                <button class="btn-save" onclick="saveConfig()">💾 保存配置</button>
                <button class="btn-test" onclick="testConfig()">🔍 测试</button>
            </div>

            <div id="configStatus" class="status-msg"></div>

            <div class="pool-actions">
                <button class="btn-refresh-pool" id="btnRefreshPool" onclick="refreshSeatMap()">🔄 刷新号码池</button>
                <span class="pool-hint">从钓场列表更新座位映射表</span>
            </div>
            <div id="poolStatus" class="pool-status"></div>

            <div class="venue-mgr-section">
                <div class="section-title">
                    <span>钓场管理</span>
                    <span class="count-badge" id="venueCount">0 个</span>
                </div>
                <div class="venue-dropdown-wrapper">
                    <div class="venue-dropdown-header" id="venueDropdownToggle">
                        <span class="title">📋 管理钓场</span>
                        <span class="arrow" id="dropdownArrow">▼</span>
                    </div>
                    <div class="venue-dropdown-body" id="venueDropdownBody">
                        <div class="venue-mgr-add">
                            <input id="venueNameInput" placeholder="钓场名称" />
                            <input id="venueOrderIdInput" placeholder="订单 ID" />
                            <button class="btn-add" onclick="addVenue()">➕ 添加</button>
                        </div>
                        <div class="venue-mgr-list" id="venueMgrList">
                            <div class="venue-mgr-loading">加载中...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <a class="tab" href="lucky.html"><span class="tab-icon">🎯</span><span class="tab-label">幸运号码</span></a>
    <a class="tab" href="detective.html"><span class="tab-icon">🕵🏻</span><span class="tab-label">钓场侦探</span></a>
    <a class="tab active" href="config.html"><span class="tab-icon">⚙️</span><span class="tab-label">配置</span></a>
</div>

<script src="../assets/common.js"></script>
<script>
var dropdownToggle = document.getElementById('venueDropdownToggle');
var dropdownBody = document.getElementById('venueDropdownBody');
var dropdownArrow = document.getElementById('dropdownArrow');
var isDropdownOpen = false;

dropdownToggle.addEventListener('click', function() {
    if (isDropdownOpen) {
        dropdownBody.style.maxHeight = dropdownBody.scrollHeight + 'px';
        void dropdownBody.offsetHeight;
        dropdownBody.style.maxHeight = '0px';
        dropdownArrow.classList.remove('open');
        isDropdownOpen = false;
    } else {
        dropdownBody.style.maxHeight = dropdownBody.scrollHeight + 'px';
        dropdownArrow.classList.add('open');
        isDropdownOpen = true;
    }
});

dropdownBody.addEventListener('transitionend', function(e) {
    if (e.propertyName === 'max-height' && isDropdownOpen) {
        dropdownBody.style.maxHeight = 'none';
    }
});

function saveConfig() {
    var token = document.getElementById('tokenInput').value.trim();
    var uuid = document.getElementById('uuidInput').value.trim();
    if (!token || !uuid) {
        setStatusMsg('⚠️ Token 和 UUID 不能为空', 'error');
        return;
    }
    saveData('token', token);
    saveData('uuid', uuid);
    if (window.AndroidBridge && window.AndroidBridge.setAuth) {
        window.AndroidBridge.setAuth(token, uuid);
        setStatusMsg('✅ 配置已保存，并已注入原生层！', 'success');
    } else {
        setStatusMsg('⚠️ 已保存到本地，但 AndroidBridge 不可用', 'info');
    }
}

async function testConfig() {
    var token = document.getElementById('tokenInput').value.trim();
    var uuid = document.getElementById('uuidInput').value.trim();
    if (!token || !uuid) {
        setStatusMsg('⚠️ 请先填写 Token 和 UUID', 'error');
        return;
    }
    if (!window.AndroidBridge) {
        setStatusMsg('❌ AndroidBridge 未注入！', 'error');
        return;
    }
    setStatusMsg('⏳ 测试中...', 'info');
    saveData('token', token);
    saveData('uuid', uuid);
    if (window.AndroidBridge.setAuth) {
        window.AndroidBridge.setAuth(token, uuid);
    }
    try {
        var result = await callApi('/v2/userApi/order/getMyTicketOrderList?tab=10&page=1&limit=20', 'GET');
        if (result.code === '000') {
            setStatusMsg('✅ 测试成功！Token 和 UUID 有效', 'success');
        } else {
            setStatusMsg('❌ 测试失败: ' + (result.msg || 'Token 无效'), 'error');
        }
    } catch(e) {
        setStatusMsg('❌ 测试异常: ' + e.message, 'error');
    }
}

function loadVenuesFromLocal() {
    try {
        if (window.AndroidBridge && window.AndroidBridge.loadVenues) {
            var json = window.AndroidBridge.loadVenues();
            if (json && json !== '[]') return JSON.parse(json);
        }
        var stored = loadData('venues_data', '');
        if (stored) return JSON.parse(stored);
    } catch(e) {}
    return null;
}

function saveVenuesToLocal(venues) {
    var json = JSON.stringify(venues);
    if (window.AndroidBridge && window.AndroidBridge.saveVenues) {
        window.AndroidBridge.saveVenues(json);
    }
    saveData('venues_data', json);
}

async function loadVenueList() {
    var listEl = document.getElementById('venueMgrList');
    listEl.innerHTML = '<div class="venue-mgr-loading">加载中...</div>';
    var venues = loadVenuesFromLocal();
    if (venues === null) {
        try {
            var resp = await fetch('venues.json');
            venues = await resp.json();
            saveVenuesToLocal(venues);
        } catch(e) {
            venues = [];
        }
    }
    renderVenueList(venues);
}

function renderVenueList(venues) {
    var listEl = document.getElementById('venueMgrList');
    var countEl = document.getElementById('venueCount');
    countEl.textContent = venues.length + ' 个';
    if (!venues || venues.length === 0) {
        listEl.innerHTML = '<div class="venue-mgr-empty">暂无钓场</div>';
        return;
    }
    var html = '';
    venues.forEach(function(v) {
        html += '<div class="venue-mgr-item">' +
            '<div class="info">' +
                '<span class="name">' + escapeHtml(v.name) + '</span>' +
                '<span class="order-id">ID: ' + escapeHtml(v.order_id) + '</span>' +
            '</div>' +
            '<button class="btn-del" onclick="deleteVenue(' + v.id + ')">删除</button>' +
        '</div>';
    });
    listEl.innerHTML = html;
}

function addVenue() {
    var nameInput = document.getElementById('venueNameInput');
    var orderIdInput = document.getElementById('venueOrderIdInput');
    var name = nameInput.value.trim();
    var order_id = orderIdInput.value.trim();
    if (!name || !order_id) { alert('请填写完整'); return; }
    var venues = loadVenuesFromLocal() || [];
    if (venues.some(function(v) { return v.order_id === order_id; })) { alert('已存在'); return; }
    var maxId = venues.reduce(function(max, v) { return Math.max(max, v.id || 0); }, 0);
    venues.push({ id: maxId + 1, name: name, order_id: order_id, enabled: true, sort: maxId + 1, remark: '' });
    saveVenuesToLocal(venues);
    nameInput.value = '';
    orderIdInput.value = '';
    renderVenueList(venues);
}

function deleteVenue(id) {
    if (!confirm('确定删除？')) return;
    var venues = loadVenuesFromLocal() || [];
    venues = venues.filter(function(v) { return v.id !== id; });
    saveVenuesToLocal(venues);
    renderVenueList(venues);
}

async function refreshSeatMap() {
    var btn = document.getElementById('btnRefreshPool');
    var statusEl = document.getElementById('poolStatus');
    var token = loadData('token', '');
    var uuid = loadData('uuid', '');
    if (!token || !uuid) {
        statusEl.className = 'pool-status error';
        statusEl.textContent = '⚠️ 请先配置 Token 和 UUID';
        return;
    }
    if (!window.AndroidBridge) {
        statusEl.className = 'pool-status error';
        statusEl.textContent = '❌ AndroidBridge 未注入！';
        return;
    }
    if (window.AndroidBridge.setAuth) window.AndroidBridge.setAuth(token, uuid);
    btn.disabled = true;
    btn.textContent = '⏳ 刷新中...';
    statusEl.className = 'pool-status info';
    statusEl.textContent = '⏳ 正在刷新号码池...';
    try {
        var venues = loadVenuesFromLocal() || [];
        if (venues.length === 0) {
            statusEl.className = 'pool-status error';
            statusEl.textContent = '❌ 钓场列表为空';
            btn.disabled = false;
            btn.textContent = '🔄 刷新号码池';
            return;
        }
        var seatMap = {};
        var totalSeats = 0;
        var totalVenues = 0;
        var failedVenues = [];
        for (var i = 0; i < venues.length; i++) {
            var venue = venues[i];
            try {
                var result = await callApi('/v2/userApi/ticketSeat/querySeatList?order_id=' + venue.order_id, 'GET');
                if (result.code === '000' && result.data && result.data.seat_list) {
                    var map = {};
                    result.data.seat_list.forEach(function(seat) {
                        map[seat.seat_number] = seat.product_ticket_seat_id;
                    });
                    seatMap[venue.name] = map;
                    totalSeats += result.data.seat_list.length;
                    totalVenues++;
                } else {
                    failedVenues.push(venue.name);
                }
            } catch(e) {
                failedVenues.push(venue.name);
            }
            await new Promise(function(r) { setTimeout(r, 500); });
        }
        saveSeatMapToLocal(seatMap);
        statusEl.className = 'pool-status success';
        statusEl.textContent = '✅ 号码池已刷新: ' + totalSeats + ' 个座位, ' + totalVenues + ' 个钓场' + (failedVenues.length > 0 ? ', 跳过: ' + failedVenues.join('、') : '');
    } catch(e) {
        statusEl.className = 'pool-status error';
        statusEl.textContent = '❌ 刷新失败: ' + e.message;
    } finally {
        btn.disabled = false;
        btn.textContent = '🔄 刷新号码池';
    }
}

(function initConfigPage() {
    var savedToken = loadData('token', '');
    var savedUuid = loadData('uuid', '');
    document.getElementById('tokenInput').value = savedToken;
    document.getElementById('uuidInput').value = savedUuid;
    if (savedToken && savedUuid) {
        setStatusMsg('✅ 已加载本机保存的 Token / UUID', 'success');
        if (window.AndroidBridge && window.AndroidBridge.setAuth) {
            window.AndroidBridge.setAuth(savedToken, savedUuid);
        }
    } else {
        setStatusMsg('📌 请填写 Token 和 UUID，然后保存配置', 'info');
    }
    loadVenueList();
})();
</script>
</body>
</html>
